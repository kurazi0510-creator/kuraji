<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16213e"><title>倉治整骨院｜予約状況</title><style>html,body{margin:0;height:100%;background:#16213e}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="g" src="yoyaku_status_generator_pro_final.html?v=202609140730"></iframe><script>const GAS='https://script.google.com/macros/s/AKfycbyRO5WSOy-nZw4eMwFaTS-9wYXwNgoQoMZbre3hRf2C9McEfnyrDUNTWm7YvmOL4J5w/exec',GK='kuraji_publish_gas_url_v1';try{localStorage.setItem(GK,GAS)}catch(e){}const f=document.getElementById('g');f.addEventListener('load',()=>{try{localStorage.setItem(GK,GAS);const d=f.contentDocument;if(!d)return;const reset=d.getElementById('yResetPublishBtn');if(reset)reset.style.display='none';const b=d.getElementById('yDlBtn');if(b)b.textContent='📱 写真アプリに保存';d.addEventListener('click',async e=>{const btn=e.target.closest&&e.target.closest('#yDlBtn');if(!btn)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const c=d.getElementById('yCanvas');if(!c||!c.width){alert('先に画像を生成してください');return}c.toBlob(async blob=>{if(!blob)return;const date=d.getElementById('yDate')?.value||'kuraji';const file=new File([blob],date+'.jpg',{type:'image/jpeg'});try{if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'倉治整骨院 予約空き状況'});return}}catch(x){if(x?.name==='AbortError')return}const u=URL.createObjectURL(blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)},'image/jpeg',.95)},true)}catch(e){console.error(e)}});</script></body></html>
