<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16213e"><title>倉治整骨院｜予約状況</title><style>html,body{margin:0;height:100%;background:#16213e}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="g" src="yoyaku_status_generator_pro_final.html?v=202609140825"></iframe><script>const f=document.getElementById('g');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const reset=d.getElementById('yResetPublishBtn');if(reset)reset.style.display='none';const b=d.getElementById('yDlBtn');if(b)b.textContent='📱 iPhoneの写真に保存';d.addEventListener('click',async e=>{const btn=e.target.closest&&e.target.closest('#yDlBtn');if(!btn)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const c=d.getElementById('yCanvas');if(!c||!c.width){alert('先に画像を生成してください');return}c.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'予約空き状況.jpg',{type:'image/jpeg'});try{if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});return}}catch(x){if(x?.name==='AbortError')return}const u=URL.createObjectURL(blob);window.open(u,'_blank')},'image/jpeg',.95)},true);const s=d.getElementById('yPublishStatus'),p=d.getElementById('yPublishBtn');if(s&&p){let retried=false;new MutationObserver(()=>{if(!retried&&s.textContent.includes('Load failed')){retried=true;s.textContent='通信を再試行しています…';setTimeout(()=>p.click(),1200)}else if(s.textContent.includes('公開しました'))retried=false}).observe(s,{childList:true,subtree:true,characterData:true})}}catch(e){console.error(e)}});</script></body></html>
