function addLog(msg){
  const el=document.getElementById('log');
  el.style.display='block';
  el.textContent+=msg+'\n';
  el.scrollTop=el.scrollHeight;
}
function setStatus(msg,cls){
  const el=document.getElementById('status');
  el.style.display='block';
  el.className=cls;
  el.textContent=msg;
}
function normTel(t){
  const d=String(t||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.charAt(0)!=='0' && d.length>=9 && d.length<=10) return '0'+d;
  return d;
}
function fmtDate(v){
  if(!v) return '';
  const s=String(v).trim();
  if(!s || s==='-') return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(isNaN(d.getTime())) return '';
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
// バックアップ行(TSVの配列)を患者オブジェクトに変換
function parseBackupRow(r){
  const id=String(r[0]||'').trim();
  const name=String(r[1]||'').trim();
  if(!id||!name) return null;
  return {
    id, name,
    kana:String(r[2]||'').trim(),
    sex:String(r[3]||'').trim(),
    tel:normTel(r[4]),
    line:String(r[5]||'').trim(),
    lineUid:String(r[6]||'').trim(),
    city:String(r[7]||'').trim(),
    job:String(r[8]||'').trim(),
    src:String(r[9]||'').trim(),
    symptom:String(r[10]||'').trim(),
    last:fmtDate(r[11]),
    count:parseInt(r[12])||0,
    dob:String(r[13]||'').trim(),
    note:String(r[14]||'').trim(),
  };
}
// GASの生データ(患者シートの2次元配列)を患者オブジェクトに変換
function parseGasRow(headers,r){
  const hi=k=>headers.indexOf(k);
  const id=String(r[0]||'').trim();
  const name=String(r[1]||'').trim();
  if(!id||!name) return null;
  const gv=(k,fb)=>{const i=hi(k);return String((i>-1?r[i]:r[fb])||'').trim();};
  return {
    id, name,
    kana:gv('ふりがな',2),
    sex:gv('性別',3),
    tel:normTel(gv('電話番号',4)),
    line:gv('LINE',5),
    lineUid:gv('LINEユーザーID',6),
    city:gv('住所',7),
    job:gv('職業',8),
    src:gv('流入元',9),
    symptom:gv('症状',10),
    last:fmtDate(gv('前回通院日',11)),
    count:parseInt(gv('通院回数',12))||0,
    dob:gv('生年月日',13),
    note:gv('備考',14),
  };
}

let gasPatients=[];

async function checkCurrent(){
  try{
    const res=await fetch(GAS+'?action=getAll&t='+Date.now(),{cache:'no-store'});
    const d=await res.json();
    const rows=d.customers||[];
    if(rows.length>1){
      const headers=rows[0].map(h=>String(h||'').trim());
      gasPatients=rows.slice(1).map(r=>parseGasRow(headers,r)).filter(Boolean);
    }
    document.getElementById('current-state').innerHTML=
      '今のGAS患者シート：<b>'+gasPatients.length+'名</b><br>'+
      'バックアップデータ：<b>'+BACKUP_ROWS.length+'名</b>';
  }catch(e){
    document.getElementById('current-state').innerHTML='<span style="color:#dc2626">確認エラー：'+e.message+'</span>';
  }
}
checkCurrent();

async function doRestore(){
  document.getElementById('btn-restore').disabled=true;
  setStatus('🔄 復元中...','ing');
  document.getElementById('log').innerHTML='';
  addLog('現在のGAS患者データ: '+gasPatients.length+'名');

  const byId={};
  gasPatients.forEach(p=>{byId[p.id]=p;});

  let added=0, filled=0;
  BACKUP_ROWS.forEach(r=>{
    const bp=parseBackupRow(r);
    if(!bp) return;
    if(!byId[bp.id]){
      byId[bp.id]=bp;
      added++;
      addLog('➕ 追加: No.'+bp.id+' '+bp.name);
    }else{
      const ex=byId[bp.id];
      let didFill=false;
      Object.keys(bp).forEach(k=>{
        if(!ex[k] && bp[k]){ ex[k]=bp[k]; didFill=true; }
      });
      if(didFill){ filled++; addLog('🔧 補完: No.'+bp.id+' '+bp.name); }
    }
  });

  const merged=Object.values(byId);
  addLog('---');
  addLog('追加: '+added+'名 / 補完: '+filled+'名 / 合計: '+merged.length+'名');

  // GASへ書き込み
  const hdr=['診察券No','患者名','ふりがな','性別','電話番号','LINE','LINEユーザーID','住所','職業','流入元','症状','前回通院日','通院回数','生年月日','備考'];
  const rows=[hdr,...merged.map(p=>[p.id,p.name,p.kana||'',p.sex||'',p.tel||'',p.line||'',p.lineUid||'',p.city||'',p.job||'',p.src||'',p.symptom||'',p.last||'',p.count||0,p.dob||'',p.note||''])];
  try{
    const res=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveCustomers',rows:JSON.stringify(rows)})});
    const d=await res.json();
    if(!d.ok){ setStatus('❌ GASへの保存に失敗しました','err'); document.getElementById('btn-restore').disabled=false; return; }
  }catch(e){
    setStatus('❌ 通信エラー：'+e.message,'err');
    document.getElementById('btn-restore').disabled=false;
    return;
  }

  // この端末のlocalStorageも更新（kanri.htmlと同じドメインなので反映される）
  try{
    localStorage.setItem('kj_p', JSON.stringify(merged));
    addLog('この端末のデータも更新しました');
  }catch(e){ addLog('localStorage更新エラー（GAS側は成功しています）: '+e.message); }

  setStatus('✅ 復元完了！\n\n合計 '+merged.length+'名になりました。\n\nkanri.htmlを開き直して確認してください。','ok');
  document.getElementById('btn-restore').disabled=false;
}
