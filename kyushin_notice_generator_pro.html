<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>倉治整骨院｜休診お知らせ作成</title><style>*{box-sizing:border-box}body{margin:0;background:#16213e;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#33251c;padding:18px 12px 50px}.wrap{max-width:460px;margin:auto}h1{color:#fff;text-align:center;font-size:20px;margin:0 0 15px}.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}.row{margin-bottom:12px}label{display:block;font-size:12px;font-weight:800;color:#6b5a4e;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:2px solid #eee;border-radius:10px;font:inherit}textarea{min-height:90px}.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}.type{border:2px solid #f1d0b6;background:#fff8f2;padding:10px 5px;border-radius:10px;font-weight:800;color:#8f4a18}.type.on{background:#f36c0a;color:#fff;border-color:#f36c0a}.gen,.save{width:100%;border:0;border-radius:14px;padding:16px;color:#fff;font-weight:900;font-size:17px}.gen{background:#f36c0a}.save{background:#16a34a;margin-top:12px}canvas{width:100%;height:auto;border-radius:14px;margin-top:14px;background:#fff;box-shadow:0 8px 30px #0007}.hint{font-size:12px;color:#9a5a2a;background:#fff7ed;border-radius:9px;padding:9px;margin-top:10px}</style></head><body><div class="wrap"><h1>🏥 倉治整骨院｜休診お知らせ作成</h1><div class="panel"><div class="row"><label>休診の種類</label><div class="types"><button class="type on" data-v="急な休診のお知らせ">急な休診</button><button class="type" data-v="祝日休診のお知らせ">祝日休診</button><button class="type" data-v="研修・学会による休診のお知らせ">研修・学会</button><button class="type" data-v="休診のお知らせ">その他</button></div></div><div class="row"><label>休診日</label><input id="date" type="date"></div><div class="row"><label>休診終了日（連休の場合のみ）</label><input id="end" type="date"></div><div class="row"><label>タイトル</label><input id="title" value="急な休診のお知らせ"></div><div class="row"><label>患者様へのメッセージ</label><textarea id="msg">急なご連絡となり、大変申し訳ございません。&#10;ご迷惑をおかけいたしますが、何卒ご理解のほどよろしくお願いいたします。</textarea></div><div class="row"><label>再開案内（任意）</label><input id="reopen" placeholder="例：9月14日（月）より通常通り受付します"></div><div class="hint">倉治整骨院のオレンジで統一し、40〜60代の方にも日付が一目で伝わるデザインです。</div></div><button class="gen" onclick="make()">休診お知らせ画像を生成</button><canvas id="c" width="800" height="800"></canvas><button class="save" onclick="save()">写真を保存する</button></div><script>const $=id=>document.getElementById(id),days=['日','月','火','水','木','金','土'];document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('title').value=b.dataset.v});function rr(x,y,w,h,r){let c=$('c').getContext('2d');c.beginPath();c.roundRect(x,y,w,h,r)}function wrap(c,t,x,y,mw,lh,max=4){let ls=[],l='';for(const ch of [...t]){let q=l+ch;if(c.measureText(q).width>mw&&l){ls.push(l);l=ch}else l=q}if(l)ls.push(l);ls=ls.slice(0,max);ls.forEach((s,i)=>c.fillText(s,x,y+i*lh));return ls.length*lh}function make(){if(!$('date').value){alert('休診日を入力してください');return}const c=$('c'),x=c.getContext('2d'),d=new Date($('date').value+'T00:00:00'),O='#f36c0a',D='#b84f00',I='#33251c';x.fillStyle='#fff9f2';x.fillRect(0,0,800,800);x.fillStyle=O;x.fillRect(0,0,800,132);x.textAlign='center';x.fillStyle='#fff';x.font='700 20px sans-serif';x.fillText('倉 治 整 骨 院',400,39);x.font='900 43px sans-serif';x.fillText('休診のお知らせ',400,94);x.fillStyle='#fff';rr(54,158,692,152,20);x.fill();x.strokeStyle='#f2c39e';x.lineWidth=3;rr(54,158,692,152,20);x.stroke();x.fillStyle=D;x.font='800 18px sans-serif';x.fillText('休 診 日',400,194);let dt=`${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;if($('end').value){let e=new Date($('end').value+'T00:00:00');dt+=` 〜 ${e.getMonth()+1}月${e.getDate()}日（${days[e.getDay()]}）`;x.font='900 37px sans-serif'}else x.font='900 50px sans-serif';x.fillStyle=I;x.fillText(dt,400,258);x.font='900 31px sans-serif';x.fillText($('title').value||'休診のお知らせ',400,356);x.fillStyle=O;x.fillRect(318,377,164,5);let y=425;x.fillStyle='#5d4b3f';x.font='600 22px sans-serif';for(const p of ($('msg').value||'').split(/\n+/).filter(Boolean)){y+=wrap(x,p,400,y,650,34,3)+5}if($('reopen').value){y=Math.max(y+12,545);x.fillStyle='#fff0e2';rr(78,y,644,70,16);x.fill();x.fillStyle=D;x.font='900 23px sans-serif';x.fillText($('reopen').value,400,y+44);y+=90}let fy=Math.max(650,Math.min(y+8,680));x.fillStyle='#fff';rr(54,fy,692,74,16);x.fill();x.strokeStyle='#f2c39e';x.lineWidth=2;rr(54,fy,692,74,16);x.stroke();x.fillStyle=I;x.font='800 19px sans-serif';x.fillText('ご予約・お問い合わせは LINE またはお電話で',400,fy+29);x.fillStyle=D;x.font='900 24px sans-serif';x.fillText('TEL 072-892-3223',400,fy+58);x.fillStyle=O;x.fillRect(0,770,800,30);x.fillStyle='#fff';x.font='700 14px sans-serif';x.fillText('倉治整骨院｜大阪府交野市倉治1丁目22-15',400,791)}function save(){make();$('c').toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='休診のお知らせ.jpg';a.click()},'image/jpeg',.94)}make();</script></body></html>
