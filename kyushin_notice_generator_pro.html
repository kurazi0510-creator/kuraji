<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>倉治整骨院｜休診お知らせ作成</title><style>*{box-sizing:border-box}body{margin:0;background:#16213e;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#33251c;padding:18px 12px 50px}.wrap{max-width:460px;margin:auto}h1{color:#fff;text-align:center;font-size:20px;margin:0 0 15px}.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}.row{margin-bottom:12px}label{display:block;font-size:13px;font-weight:800;color:#6b5a4e;margin-bottom:5px}input,textarea{width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font:inherit}textarea{min-height:100px}.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}.type{border:2px solid #f1d0b6;background:#fff8f2;padding:11px 5px;border-radius:10px;font-weight:800;color:#8f4a18}.type.on{background:#f36c0a;color:#fff;border-color:#f36c0a}.gen,.save{width:100%;border:0;border-radius:14px;padding:16px;color:#fff;font-weight:900;font-size:17px}.gen{background:#f36c0a}.save{background:#16a34a;margin-top:12px}canvas{width:100%;height:auto;border-radius:14px;margin-top:14px;background:#fff;box-shadow:0 8px 30px #0007}.hint{font-size:12px;color:#9a5a2a;background:#fff7ed;border-radius:9px;padding:10px;margin-top:10px}</style></head><body><div class="wrap"><h1>🏥 倉治整骨院｜休診お知らせ作成</h1><div class="panel"><div class="row"><label>休診の種類</label><div class="types"><button class="type on" data-v="急な休診のお知らせ">急な休診</button><button class="type" data-v="祝日休診のお知らせ">祝日休診</button><button class="type" data-v="研修・学会による休診のお知らせ">研修・学会</button><button class="type" data-v="休診のお知らせ">その他</button></div></div><div class="row"><label>休診日</label><input id="date" type="date"></div><div class="row"><label>休診終了日（連休の場合のみ）</label><input id="end" type="date"></div><div class="row"><label>タイトル</label><input id="title" value="急な休診のお知らせ"></div><div class="row"><label>患者様へのメッセージ</label><textarea id="msg">急なご連絡となり、大変申し訳ございません。&#10;ご迷惑をおかけいたしますが、何卒ご理解のほどよろしくお願いいたします。</textarea></div><div class="row"><label>再開案内（任意）</label><input id="reopen" placeholder="例：9月14日（月）より通常通り受付します"></div><div class="hint">日付を最優先で大きく表示し、40〜60代の方にもスマートフォンで読みやすい構成にしています。</div></div><button class="gen" onclick="make()">休診お知らせ画像を生成</button><canvas id="c" width="800" height="800"></canvas><button class="save" onclick="save()">写真を保存する</button></div><script>const $=id=>document.getElementById(id),days=['日','月','火','水','木','金','土'];document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('title').value=b.dataset.v});function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function lines(ctx,text,maxWidth,maxLines=4){let out=[],line='';for(const ch of [...text]){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=ch}else line=test}if(line)out.push(line);return out.slice(0,maxLines)}function make(){if(!$('date').value){alert('休診日を入力してください');return}const c=$('c'),x=c.getContext('2d'),d=new Date($('date').value+'T00:00:00'),O='#f36c0a',D='#a94400',INK='#2f241e',SUB='#5b4b41';x.clearRect(0,0,800,800);x.fillStyle='#fffaf5';x.fillRect(0,0,800,800);x.fillStyle=O;x.fillRect(0,0,800,126);x.textAlign='center';x.fillStyle='#fff';x.font='800 19px sans-serif';x.fillText('倉 治 整 骨 院',400,36);x.font='900 44px sans-serif';x.fillText('休診のお知らせ',400,91);x.fillStyle='#fff';rr(x,45,151,710,170,22);x.fill();x.strokeStyle='#f1c29d';x.lineWidth=3;rr(x,45,151,710,170,22);x.stroke();x.fillStyle=D;x.font='900 18px sans-serif';x.fillText('休 診 日',400,187);let dt=`${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;if($('end').value){const e=new Date($('end').value+'T00:00:00');dt+=` 〜 ${e.getMonth()+1}月${e.getDate()}日（${days[e.getDay()]}）`;x.font='900 38px sans-serif'}else{x.font='900 58px sans-serif'}x.fillStyle=INK;x.fillText(dt,400,265);x.font='900 32px sans-serif';x.fillStyle=INK;x.fillText($('title').value||'休診のお知らせ',400,370);let y=420;x.fillStyle=SUB;x.font='700 23px sans-serif';for(const p of ($('msg').value||'').split(/\n+/).filter(Boolean)){for(const s of lines(x,p,660,3)){x.fillText(s,400,y);y+=35}y+=5}if($('reopen').value){y=Math.max(y+10,535);x.fillStyle='#fff0e2';rr(x,65,y,670,72,16);x.fill();x.fillStyle=D;x.font='900 23px sans-serif';x.fillText($('reopen').value,400,y+45);y+=90}const fy=Math.max(645,Math.min(y+12,675));x.fillStyle='#fff';rr(x,50,fy,700,82,17);x.fill();x.strokeStyle='#efc29e';x.lineWidth=2;rr(x,50,fy,700,82,17);x.stroke();x.fillStyle=INK;x.font='900 20px sans-serif';x.fillText('ご予約・お問い合わせは LINE またはお電話で',400,fy+31);x.fillStyle=D;x.font='900 27px sans-serif';x.fillText('TEL 072-892-3223',400,fy+64);x.fillStyle=O;x.fillRect(0,770,800,30);x.fillStyle='#fff';x.font='800 14px sans-serif';x.fillText('倉治整骨院｜大阪府交野市倉治1丁目22-15',400,791)}function save(){make();$('c').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='倉治整骨院_休診のお知らせ.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.95)}const now=new Date();$('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;make();</script></body></html>
