name: Build Yoyaku PRO Final

on:
  push:
    paths:
      - '.github/workflows/build-yoyaku-pro-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add publish settings reset button to PRO final
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('yoyaku_status_generator_pro_final.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="publish-status" id="yPublishStatus"></div>'
          new='''<div class="publish-status" id="yPublishStatus"></div>
      <button type="button" id="yResetPublishBtn" onclick="resetPublishCredentials();document.getElementById('yPublishStatus').textContent='公開設定をリセットしました。次回「最新の予約状況として公開」を押すと再入力できます。';" style="width:100%;background:#fff7ed;color:#9a3412;border:2px solid #fdba74;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">🔧 公開設定を再入力</button>'''
          if 'id="yResetPublishBtn"' not in s:
              if old not in s:
                  raise SystemExit('publish status marker not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify button and preserved production logic
        shell: bash
        run: |
          grep -q 'id="yResetPublishBtn"' yoyaku_status_generator_pro_final.html
          grep -q "async function autoFetchAvailability" yoyaku_status_generator_pro_final.html
          grep -q "async function publishTodayStatus" yoyaku_status_generator_pro_final.html
          grep -q "function resetPublishCredentials" yoyaku_status_generator_pro_final.html
          grep -q "const KURAJI_GAS=" yoyaku_status_generator_pro_final.html
      - name: Commit updated standalone file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yoyaku_status_generator_pro_final.html
          git diff --cached --quiet && exit 0
          git commit -m "Add publish settings reset button"
          git push
