name: Build Yoyaku PRO Final

on:
  push:
    paths:
      - '.github/workflows/build-yoyaku-pro-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add reset button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('yoyaku_status_generator_pro_final.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="publish-status" id="yPublishStatus"></div>'
          button = '<button type="button" id="yResetPublishBtn" onclick="resetPublishCredentials();document.getElementById(\'yPublishStatus\').textContent=\'公開設定をリセットしました。次回の公開時に再入力してください。\';" style="width:100%;background:#fff7ed;color:#9a3412;border:2px solid #fdba74;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">🔧 公開設定を再入力</button>'
          if 'id="yResetPublishBtn"' not in s:
              if marker not in s:
                  raise SystemExit('marker not found')
              s = s.replace(marker, marker + '\n      ' + button, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'id="yResetPublishBtn"' yoyaku_status_generator_pro_final.html
          grep -q 'async function autoFetchAvailability' yoyaku_status_generator_pro_final.html
          grep -q 'async function publishTodayStatus' yoyaku_status_generator_pro_final.html
          grep -q 'function resetPublishCredentials' yoyaku_status_generator_pro_final.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yoyaku_status_generator_pro_final.html
          git diff --cached --quiet && exit 0
          git commit -m "Add publish settings reset button"
          git push
