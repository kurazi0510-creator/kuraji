<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f36c0a">
<title>本日の予約空き状況｜倉治整骨院</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fffaf5;color:#33251c}.wrap{max-width:620px;margin:auto;padding:16px 12px 38px}.brand{text-align:center;color:#b65a16;font-weight:900;font-size:16px}.title{text-align:center;font-size:27px;margin:5px 0 3px}.updated{text-align:center;font-size:14px;font-weight:800;color:#765744;margin:0 0 12px}.status{background:#fff;border:1px solid #f1d6c1;border-radius:18px;padding:8px;box-shadow:0 5px 20px #7c3d1017}.status img{display:block;width:100%;height:auto;border-radius:12px}.loading{padding:45px 12px;text-align:center;font-size:17px;font-weight:800;color:#765744}.error,.closed{padding:34px 18px;text-align:center;line-height:1.8;font-weight:800}.error{color:#8a3e09}.closed{color:#6b4b36}.closed strong{display:block;font-size:24px;color:#d95a08;margin-bottom:8px}.closed .sub{font-size:15px;font-weight:700;color:#6f6259}.actions{display:grid;gap:10px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:14px;text-decoration:none;font-size:18px;font-weight:900}.line{background:#06c755;color:#fff}.phone{background:#fff;color:#b84f00;border:2px solid #f36c0a}.web{background:#f36c0a;color:#fff}.note{text-align:center;font-size:13px;line-height:1.65;color:#66594f;margin:13px 8px 0}.accident{display:block;margin-top:18px;padding:16px;border-radius:14px;background:#fff4e8;border:1px solid #f3c69e;color:#8a3e09;text-align:center;text-decoration:none;font-size:16px;font-weight:900}.info{text-align:center;font-size:13px;line-height:1.8;color:#76685f;margin-top:19px}@media(max-width:430px){.title{font-size:25px}.wrap{padding-top:13px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">倉治整骨院</div>
<h1 class="title">本日の予約空き状況</h1>
<div class="updated" id="updated">最新情報を読み込んでいます…</div>
<section class="status" id="status"><div class="loading">予約空き状況を読み込み中です…</div></section>
<div class="actions">
<a class="btn line" href="https://lin.ee/R9YWaJx">LINEで当日予約・相談</a>
<a class="btn phone" href="tel:0728923223">☎ 072-892-3223 に電話する</a>
<a class="btn web" href="https://kurazi0510-creator.github.io/kuraji/book.html">明日以降のWEB予約</a>
</div>
<p class="note">当日の空き状況は変動します。表示中の時間でも、ご連絡のタイミングにより埋まっている場合があります。</p>
<a class="accident" href="https://kurazi0510-creator.github.io/kuraji/traffic_accident.html">🚗 交通事故・むちうちの無料相談</a>
<div class="info">倉治整骨院<br>大阪府交野市倉治1丁目22-15<br>8:30〜12:30／15:00〜20:00<br>木曜・土曜は午前のみ／日曜・祝日休診</div>
</main>
<script>
(function(){
 const GAS='https://script.google.com/macros/s/AKfycbyRO5WSOy-nZw4eMwFaTS-9wYXwNgoQoMZbre3hRf2C9McEfnyrDUNTWm7YvmOL4J5w/exec';
 const status=document.getElementById('status');
 const updated=document.getElementById('updated');
 const jstNow=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
 const ymd=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
 function isClosedNow(){
   const n=jstNow(),day=n.getDay(),mins=n.getHours()*60+n.getMinutes();
   if(day===0) return true;
   if(day===4||day===6) return mins>=12*60+30;
   return mins>=20*60;
 }
 function showClosed(message){
   status.innerHTML='<div class="closed"><strong>本日の受付は終了しました</strong><div class="sub">'+message+'</div></div>';
   updated.textContent='明日以降のご予約はWEB予約をご利用ください';
 }
 function render(){
   const d=window.KURAJI_LATEST_STATUS;
   const now=jstNow();
   if(isClosedNow()){showClosed('本日の診療時間は終了しております。');return;}
   if(!d||!d.ok||!d.image){status.innerHTML='<div class="error">最新の予約状況を取得できませんでした。<br>少し時間をおいて再読み込みしてください。</div>';updated.textContent='';return;}
   if(d.updatedAt){
     const x=new Date(d.updatedAt);
     const xj=new Date(x.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
     if(ymd(xj)!==ymd(now)){
       status.innerHTML='<div class="closed"><strong>本日の空き状況は未更新です</strong><div class="sub">別日の予約画像は表示していません。<br>お急ぎの場合はLINEまたはお電話でお問い合わせください。</div></div>';
       updated.textContent='本日分の最新情報をご確認ください';
       return;
     }
   }
   const img=document.createElement('img');img.alt='倉治整骨院 本日の予約空き状況';img.src=d.image;status.innerHTML='';status.appendChild(img);
   if(d.updatedAt){const x=new Date(d.updatedAt);updated.textContent='最終更新：'+x.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}else{updated.textContent='最新の予約空き状況';}
 }
 window.addEventListener('kuraji-status-loaded',render,{once:true});
 const s=document.createElement('script');s.src=GAS+'?action=js&t='+Date.now();s.onerror=function(){if(isClosedNow()){showClosed('本日の診療時間は終了しております。');return;}status.innerHTML='<div class="error">最新の予約状況を取得できませんでした。<br>再読み込みしてください。</div>';updated.textContent='';};document.body.appendChild(s);
 setTimeout(function(){if(!window.KURAJI_LATEST_STATUS){if(isClosedNow()){showClosed('本日の診療時間は終了しております。');return;}status.innerHTML='<div class="error">読み込みに時間がかかっています。<br>画面を再読み込みしてください。</div>';updated.textContent='';}},10000);
})();
</script>
</body>
</html>
