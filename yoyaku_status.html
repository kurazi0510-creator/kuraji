<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f36c0a">
<title>本日の予約空き状況｜倉治整骨院</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fffaf5;color:#33251c}.wrap{max-width:620px;margin:auto;padding:16px 12px 38px}.brand{text-align:center;color:#b65a16;font-weight:900;font-size:16px}.title{text-align:center;font-size:27px;margin:5px 0 3px}.updated{text-align:center;font-size:14px;font-weight:800;color:#765744;margin:0 0 12px}.status{background:#fff;border:1px solid #f1d6c1;border-radius:18px;padding:8px;box-shadow:0 5px 20px #7c3d1017}.status img{display:block;width:100%;height:auto;border-radius:12px}.loading{padding:45px 12px;text-align:center;font-size:17px;font-weight:800;color:#765744}.error,.closed,.full{padding:34px 18px;text-align:center;line-height:1.8;font-weight:800}.error{color:#8a3e09}.closed{color:#6b4b36}.closed strong,.full strong{display:block;font-size:24px;color:#d95a08;margin-bottom:8px}.closed .sub,.full .sub{font-size:15px;font-weight:700;color:#6f6259}.full{padding:42px 18px;background:linear-gradient(145deg,#fff9f2,#fff3e4);border-radius:12px}.full .badge{display:inline-block;margin-bottom:14px;padding:5px 15px;border-radius:999px;background:#f36c0a;color:#fff;font-size:14px;letter-spacing:.06em}.full .wait{margin-top:13px;padding:12px;border-radius:12px;background:#fff;border:1px solid #f3c69e;color:#8a3e09;font-size:16px}.actions{display:grid;gap:10px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:14px;text-decoration:none;font-size:18px;font-weight:900}.line{background:#06c755;color:#fff}.phone{background:#fff;color:#b84f00;border:2px solid #f36c0a}.web{background:#f36c0a;color:#fff}.note{text-align:center;font-size:13px;line-height:1.65;color:#66594f;margin:13px 8px 0}.accident{display:block;margin-top:18px;padding:16px;border-radius:14px;background:#fff4e8;border:1px solid #f3c69e;color:#8a3e09;text-align:center;text-decoration:none;font-size:16px;font-weight:900}.info{text-align:center;font-size:13px;line-height:1.8;color:#76685f;margin-top:19px}@media(max-width:430px){.title{font-size:25px}.wrap{padding-top:13px}}
.slotbox{margin-top:14px;background:#fff;border:2px solid #f36c0a;border-radius:18px;padding:16px 12px}.slotbox h2{margin:0 0 4px;text-align:center;font-size:19px;color:#b84f00}.slotbox .hint{text-align:center;font-size:13px;color:#765744;font-weight:700;margin:0 0 12px}.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slotbtn{min-height:56px;border:2px solid #f3b27f;background:#fff8f1;border-radius:12px;font-size:21px;font-weight:900;color:#33251c;font-family:inherit;cursor:pointer}.slotbtn:active{background:#f36c0a;color:#fff}.slotlabel{grid-column:1/-1;font-size:13px;font-weight:900;color:#b65a16;margin-top:4px}.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:100%;max-width:620px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:20px 20px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));}.sheet .when{text-align:center;font-size:24px;font-weight:900;margin:2px 0 4px}.sheet .sub2{text-align:center;font-size:13px;color:#765744;font-weight:700;margin-bottom:14px}.sheet .cancel{display:block;width:100%;margin-top:10px;padding:14px;border:none;background:#f3eee9;border-radius:14px;font-size:16px;font-weight:800;color:#66594f;font-family:inherit}.formfield{margin-bottom:12px;text-align:left}.formfield label{display:block;font-size:13px;font-weight:800;color:#765744;margin-bottom:5px}.formfield input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:17px;border:2px solid #f3d9bf;border-radius:12px;font-family:inherit;color:#33251c}.formfield input:focus{outline:none;border-color:#f36c0a}.btn.disabled{opacity:.45;pointer-events:none}.skiplink{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px;background:#eef4fb;border:2px solid #a9c8e8;border-radius:12px;font-size:14px;font-weight:800;color:#2f6fed;text-decoration:none;font-family:inherit;cursor:pointer;text-align:center}.skiplink.done{background:#e6f7ef;border-color:#8fd3b0;color:#059669}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">倉治整骨院</div>
<h1 class="title" id="pageTitle">本日の予約空き状況</h1>
<div class="updated" id="updated">最新情報を読み込んでいます…</div>
<section class="status" id="status"><div class="loading">予約空き状況を読み込み中です…</div></section>
<div class="actions">
<a class="btn line" id="lineBtn" href="https://lin.ee/R9YWaJx">LINEで当日予約・相談</a>
<a class="btn phone" href="tel:0728923223">☎ 072-892-3223 に電話する</a>
<a class="btn web" href="https://kurazi0510-creator.github.io/kuraji/book.html">明日以降のWEB予約</a>
</div>
<p class="note" id="statusNote">当日の空き状況は変動します。表示中の時間でも、ご連絡のタイミングにより埋まっている場合があります。</p>
<a class="accident" href="https://kurazi0510-creator.github.io/kuraji/traffic_accident.html">🚗 交通事故・むちうちの無料相談</a>
<div class="info">倉治整骨院<br>大阪府交野市倉治1丁目22-15<br>8:30〜12:30／15:00〜20:00<br>木曜・土曜は午前のみ／日曜・祝日休診</div>
</main>
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
 <div class="sheet">
  <div class="when" id="sheetWhen"></div>

  <div id="sheetStep1">
   <div class="sub2">ご来院は初めてですか？</div>
   <div class="actions" style="margin-top:0">
    <button type="button" class="btn line" onclick="chooseType(true)">初めての方</button>
    <button type="button" class="btn line" style="background:#059669" onclick="chooseType(false)">通院中の方</button>
    <a class="btn phone" href="tel:0728923223">☎ 電話で予約する</a>
   </div>
  </div>

  <div id="sheetStep2" style="display:none">
   <div class="sub2" id="step2Label"></div>
   <div class="formfield"><label>お名前</label><input type="text" id="fldName" placeholder="例：山田 太郎"></div>
   <div class="formfield" id="fldFuriganaWrap"><label>ふりがな</label><input type="text" id="fldFurigana" placeholder="例：やまだ たろう"></div>
   <div class="formfield"><label>お電話番号</label><input type="tel" id="fldTel" placeholder="例：09012345678"></div>
   <div class="formfield" id="fldCardWrap">
     <label>診察券番号</label>
     <input type="text" id="fldCard" placeholder="診察券に書かれている番号を入力してください">
     <button type="button" id="fldCardSkipBtn" class="skiplink" onclick="skipCard()">🤔 診察券番号がわからない方はこちら</button>
   </div>
   <div class="formfield" id="fldExtraWrap"><label id="fldExtraLabel">痛めている箇所</label><input type="text" id="fldExtra" placeholder=""></div>
   <div class="formfield" id="fldReferrerWrap"><label>ご紹介者様（いらっしゃれば）</label><input type="text" id="fldReferrer" placeholder="任意でご記入ください"></div>
   <div class="actions" style="margin-top:14px">
    <a class="btn line" id="sheetLineGo" href="#" onclick="return fillCheck()">LINEで送る</a>
   </div>
   <button type="button" class="cancel" style="margin-top:10px" onclick="backStep1()">← 戻る</button>
  </div>

  <button class="cancel" onclick="closeSheet()">閉じる</button>
 </div>
</div>
<script>
(function(){
 const GAS='https://script.google.com/macros/s/AKfycbyRO5WSOy-nZw4eMwFaTS-9wYXwNgoQoMZbre3hRf2C9McEfnyrDUNTWm7YvmOL4J5w/exec';
 const status=document.getElementById('status');
 const updated=document.getElementById('updated');
 const pageTitle=document.getElementById('pageTitle');
 const lineBtn=document.getElementById('lineBtn');
 const statusNote=document.getElementById('statusNote');
 // 満枠になった日を登録。日付が変われば通常表示へ自動復帰します。
 const FULL_DATES=new Set(['2026-09-16']);
 const jstNow=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
 const ymd=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
 function closeMinutes(day){
   if(day===0) return 0;
   if(day===4||day===6) return 12*60+30;
   return 20*60;
 }
 function isClosedNow(){
   const n=jstNow(),mins=n.getHours()*60+n.getMinutes();
   return mins>=closeMinutes(n.getDay());
 }
 function isPublishedAfterClose(d,now){
   if(!d||!d.updatedAt) return false;
   const x=new Date(d.updatedAt);
   const xj=new Date(x.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
   const mins=xj.getHours()*60+xj.getMinutes();
   return ymd(xj)===ymd(now)&&mins>=closeMinutes(now.getDay());
 }
 function showClosed(message){
   status.innerHTML='<div class="closed"><strong>本日の受付は終了しました</strong><div class="sub">'+message+'</div></div>';
   updated.textContent='明日以降のご予約はWEB予約をご利用ください';
 }
 function showFull(){
   status.innerHTML='<div class="full"><div class="badge">本日満枠</div><strong>本日のご予約は満枠となりました</strong><div class="sub">たくさんのご予約ありがとうございます。</div><div class="wait">キャンセル待ちはLINEで承ります</div></div>';
   updated.textContent='9/16 16:40更新';
   lineBtn.textContent='LINEでキャンセル待ち・相談';
   statusNote.textContent='キャンセルが出た場合は、LINEで順番にご案内いたします。明日以降はWEB予約をご利用ください。';
 }

 // ★空いている時間をタップ → LINE（メッセージ入力済み）または電話でそのまま予約
 //   ジェネレーターで公開した「手修正後の最終的な空き時間」をそのまま使う
 const WD=['日','月','火','水','木','金','土'];
 const LINE_OA='https://line.me/R/oaMessage/%40qin9307o/?';
 function renderSlots(d,now,closed){
   const old=document.getElementById('slotBox');if(old)old.remove();
   if(!d||!Array.isArray(d.slots)||!d.slots.length||!d.slotDate) return;
   const today=ymd(now);
   // 診療中は「今日」の分だけ、受付終了後は「今日より先（明日以降）」の分を表示する。
   // 明日が休診（日曜等）で先生が明後日の分を公開した場合も、日付を問わずそのまま表示する。
   if(!closed && d.slotDate!==today) return;
   if(closed && d.slotDate<=today) return;
   const nowMin=now.getHours()*60+now.getMinutes();
   const toMin=x=>{const a=x.split(':').map(Number);return a[0]*60+a[1];};
   // 本日分は、すでに過ぎた時間を出さない
   const list=d.slots.filter(x=>d.slotDate!==today||toMin(x)>nowMin);
   if(!list.length) return;
   const dt=new Date(d.slotDate+'T00:00:00');
   const diffDays=Math.round((dt-new Date(today+'T00:00:00'))/86400000);
   const relLabel=diffDays===0?'本日 ':diffDays===1?'明日 ':'次回 ';
   const dayLabel=relLabel+(dt.getMonth()+1)+'/'+dt.getDate()+'('+WD[dt.getDay()]+')';
   const am=list.filter(x=>toMin(x)<13*60),pm=list.filter(x=>toMin(x)>=13*60);
   const btns=arr=>arr.map(x=>'<button class="slotbtn" onclick="openSheet(\''+d.slotDate+'\',\''+x+'\')">'+x+'</button>').join('');
   const box=document.createElement('section');
   box.className='slotbox';box.id='slotBox';
   box.innerHTML='<h2>⏰ 時間をタップしてご予約</h2><p class="hint">'+dayLabel+'｜そのままLINEまたはお電話でご予約いただけます</p><div class="slotgrid">'+
     (am.length?'<div class="slotlabel">午前</div>'+btns(am):'')+(pm.length?'<div class="slotlabel">午後</div>'+btns(pm):'')+'</div>';
   status.insertAdjacentElement('afterend',box);
 }
 let bookLabel='', bookIsNew=true;
 window.openSheet=function(date,time){
   const dt=new Date(date+'T00:00:00');
   bookLabel=(dt.getMonth()+1)+'月'+dt.getDate()+'日('+WD[dt.getDay()]+') '+time+'〜';
   document.getElementById('sheetWhen').textContent=bookLabel;
   document.getElementById('fldName').value='';
   document.getElementById('fldFurigana').value='';
   document.getElementById('fldTel').value='';
   document.getElementById('fldCard').value='';
   document.getElementById('fldExtra').value='';
   document.getElementById('fldReferrer').value='';
   document.getElementById('sheetStep1').style.display='block';
   document.getElementById('sheetStep2').style.display='none';
   document.getElementById('sheetBg').style.display='flex';
 };
 let cardUnknown=false;
 window.skipCard=function(){
   cardUnknown=true;
   const inp=document.getElementById('fldCard');
   inp.value='不明';inp.disabled=true;
   const btn=document.getElementById('fldCardSkipBtn');
   btn.textContent='✓ 「わからない」で進めます（やり直す）';
   btn.classList.add('done');
   btn.onclick=function(){
     cardUnknown=false;
     inp.value='';inp.disabled=false;inp.focus();
     btn.textContent='🤔 診察券番号がわからない方はこちら';
     btn.classList.remove('done');
     btn.onclick=window.skipCard;
   };
 };
 window.chooseType=function(isNew){
   bookIsNew=isNew;
   cardUnknown=false;
   document.getElementById('fldCard').value='';document.getElementById('fldCard').disabled=false;
   const skipBtn=document.getElementById('fldCardSkipBtn');
   skipBtn.textContent='🤔 診察券番号がわからない方はこちら';skipBtn.classList.remove('done');skipBtn.onclick=window.skipCard;
   document.getElementById('step2Label').textContent=bookLabel+'（'+(isNew?'初めての方':'通院中の方')+'）';
   document.getElementById('fldFuriganaWrap').style.display=isNew?'block':'none';
   document.getElementById('fldReferrerWrap').style.display=isNew?'block':'none';
   document.getElementById('fldCardWrap').style.display=isNew?'none':'block';
   document.getElementById('fldExtraLabel').textContent=isNew?'痛めている箇所':'症状・ご希望';
   document.getElementById('fldExtra').placeholder=isNew?'例：右肩':'例：腰が痛い';
   document.getElementById('sheetStep1').style.display='none';
   document.getElementById('sheetStep2').style.display='block';
   document.getElementById('fldName').focus();
 };
 window.backStep1=function(){
   document.getElementById('sheetStep1').style.display='block';
   document.getElementById('sheetStep2').style.display='none';
 };
 window.fillCheck=function(){
   const name=document.getElementById('fldName').value.trim();
   const tel=document.getElementById('fldTel').value.trim();
   const furigana=document.getElementById('fldFurigana').value.trim();
   if(!name){alert('お名前を入力してください');return false;}
   if(bookIsNew && !furigana){alert('ふりがなを入力してください（受付前の診察券作成に使用します）');return false;}
   if(!tel){alert('お電話番号を入力してください');return false;}
   const telDigits=tel.replace(/[^0-9]/g,'');
   if(!/^[0-9\-ー]+$/.test(tel) || telDigits.length<10 || telDigits.length>11){alert('お電話番号を正しく入力してください（例：090-1234-5678）');return false;}
   const card=document.getElementById('fldCard').value.trim();
   if(!bookIsNew && !card && !cardUnknown){alert('診察券番号を入力するか、下の「わからない方はこちら」を押してください');return false;}
   const extra=document.getElementById('fldExtra').value.trim();
   const referrer=document.getElementById('fldReferrer').value.trim();
   const extraLabel=bookIsNew?'痛めている箇所':'症状・ご希望';
   let msg='【ご予約希望・'+(bookIsNew?'初めての方':'通院中の方')+'】\n'+bookLabel+' で予約希望です。\n\nお名前：'+name;
   if(bookIsNew) msg+='\nふりがな：'+furigana;
   msg+='\nお電話番号：'+tel;
   if(!bookIsNew && card) msg+='\n診察券番号：'+card;
   if(extra) msg+='\n'+extraLabel+'：'+extra;
   if(bookIsNew && referrer) msg+='\nご紹介者様：'+referrer;
   document.getElementById('sheetLineGo').href=LINE_OA+encodeURIComponent(msg);
   return true;
 };
 window.closeSheet=function(){const b=document.getElementById('sheetBg');b.style.display='none';b.style.height='';b.style.top='';};
 function render(){
   const d=window.KURAJI_LATEST_STATUS;
   const now=jstNow();
   const closed=isClosedNow();
   if(FULL_DATES.has(ymd(now))&&!closed){showFull();return;}
   if(!d||!d.ok||!d.image){
     if(closed){showClosed('明日の空き状況を準備中です。');return;}
     status.innerHTML='<div class="error">最新の予約状況を取得できませんでした。<br>少し時間をおいて再読み込みしてください。</div>';updated.textContent='';return;
   }
   if(closed&&!isPublishedAfterClose(d,now)){showClosed('明日の空き状況を準備中です。');return;}
   if(closed){pageTitle.textContent='明日の予約空き状況';lineBtn.textContent='LINEで予約・相談';statusNote.textContent='明日の空き状況は変動します。表示中の時間でも、ご連絡のタイミングにより埋まっている場合があります。';}
   if(d.updatedAt){
     const x=new Date(d.updatedAt);
     const xj=new Date(x.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
     if(ymd(xj)!==ymd(now)){
       status.innerHTML='<div class="closed"><strong>本日の空き状況は未更新です</strong><div class="sub">別日の予約画像は表示していません。<br>お急ぎの場合はLINEまたはお電話でお問い合わせください。</div></div>';
       updated.textContent='本日分の最新情報をご確認ください';
       return;
     }
   }
   const img=document.createElement('img');img.alt='倉治整骨院 本日の予約空き状況';img.src=d.image;status.innerHTML='';status.appendChild(img);
   renderSlots(d,now,closed);
   if(d.updatedAt){const x=new Date(d.updatedAt);updated.textContent='最終更新：'+x.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}else{updated.textContent='最新の予約空き状況';}
 }
 // 診療時間内の満枠日は、外部画像を待たずにすぐ満枠表示へ切り替えます。
 if(FULL_DATES.has(ymd(jstNow()))&&!isClosedNow()) showFull();
 window.addEventListener('kuraji-status-loaded',render,{once:true});
 const s=document.createElement('script');s.src=GAS+'?action=js&t='+Date.now();s.onerror=function(){if(isClosedNow()){showClosed('本日の診療時間は終了しております。');return;}status.innerHTML='<div class="error">最新の予約状況を取得できませんでした。<br>再読み込みしてください。</div>';updated.textContent='';};document.body.appendChild(s);
 setTimeout(function(){if(!window.KURAJI_LATEST_STATUS){if(isClosedNow()){showClosed('本日の診療時間は終了しております。');return;}status.innerHTML='<div class="error">読み込みに時間がかかっています。<br>画面を再読み込みしてください。</div>';updated.textContent='';}},10000);
 // ★キーボードが開いた時、シートがキーボードの下に隠れないようにする
 //   （LINE等アプリ内ブラウザは、キーボード表示時に画面サイズの通知が遅れたり無かったりするため
 //   visualViewportで実際に見えている高さを検知し、オーバーレイの高さをそれに合わせる）
 const sheetBgEl=document.getElementById('sheetBg');
 function fitToViewport(){
   if(!window.visualViewport||!sheetBgEl) return;
   sheetBgEl.style.height=window.visualViewport.height+'px';
   sheetBgEl.style.top=window.visualViewport.offsetTop+'px';
 }
 if(window.visualViewport){
   window.visualViewport.addEventListener('resize',fitToViewport);
   window.visualViewport.addEventListener('scroll',fitToViewport);
 }
 document.addEventListener('focusin',function(e){
   const t=e.target;
   if(t && t.tagName==='INPUT' && sheetBgEl.style.display!=='none'){
     fitToViewport();
     setTimeout(function(){
       fitToViewport();
       t.scrollIntoView({block:'center'});
     },350);
   }
 });
})();
</script>
</body>
</html>
