<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約画像ジェネレーター v2 TEST</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#16213e}#tag{position:fixed;z-index:9;right:8px;top:8px;background:#111;color:#fff;padding:6px 9px;border-radius:8px;font:700 11px sans-serif;opacity:.8}</style></head><body><div id="tag">V2 TEST</div><iframe id="app" src="yoyaku_status_generator.html"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=w.document;d.querySelectorAll('.hint-row').forEach(e=>{if(e.textContent.includes('LINE VOOM'))e.remove()});const patch=`
function compactV2(t){const m=String(t).match(/(\\d{1,2})時(?:(\\d{1,2})分)?/);return m?Number(m[1])+':'+String(m[2]||'00').padStart(2,'0'):String(t)}
function minsV2(t){const m=String(t).match(/(\\d{1,2})時(?:(\\d{1,2})分)?/);return m?Number(m[1])*60+Number(m[2]||0):9999}
function groupV2(){const s=[...selTimes].sort((a,b)=>minsV2(a)-minsV2(b)),am=[],pm=[];s.forEach(t=>(timeType[t]==='am'||(timeType[t]!=='pm'&&minsV2(t)<780)?am:pm).push(t));return {am,pm}}
function layoutV2(n){if(n<=4)return{c:4,h:62,f:31,g:10};if(n<=8)return{c:4,h:56,f:28,g:9};if(n<=15)return{c:5,h:50,f:25,g:8};return{c:5,h:44,f:22,g:7}}
function drawGroupV2(ctx,a,label,y,T,L){if(!a.length)return y;const x=34,W=732,c=Math.min(L.c,a.length),rows=Math.ceil(a.length/c),cw=(W-L.g*(c-1))/c;ctx.fillStyle='rgba(255,255,255,.94)';rrPath(ctx,x,y,110,28,14);ctx.fill();ctx.fillStyle=T.badgeText;ctx.textAlign='center';ctx.font='bold 18px sans-serif';ctx.fillText(label,x+55,y+20);let gy=y+36;a.forEach((t,i)=>{const col=i%c,row=Math.floor(i/c),cx=x+col*(cw+L.g),cy=gy+row*(L.h+L.g);ctx.fillStyle='rgba(255,255,255,.94)';rrPath(ctx,cx,cy,cw,L.h,12);ctx.fill();ctx.fillStyle=T.badgeText;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+L.f+'px sans-serif';ctx.fillText(compactV2(t),cx+cw/2,cy+L.h/2)});ctx.textBaseline='alphabetic';return gy+rows*L.h+(rows-1)*L.g}
function drawBubbleFinal(){}
function generateYoyaku(){const dateVal=document.getElementById('yDate').value;if(!dateVal){alert('日付を入力してください');return}if(!selTimes.length){alert('空き時間を選んでください');return}const d=new Date(dateVal),month=d.getMonth()+1,day=d.getDate(),dow=DAY_NAMES[d.getDay()],S=800,c=document.getElementById('yCanvas');c.width=S;c.height=S;const ctx=c.getContext('2d'),T=getTheme(yColor),G=groupV2(),L=layoutV2(selTimes.length),grad=ctx.createRadialGradient(180,100,0,400,400,800);grad.addColorStop(0,T.bg1);grad.addColorStop(1,T.bg2);ctx.fillStyle=grad;ctx.fillRect(0,0,S,S);ctx.fillStyle=T.headerBg;ctx.fillRect(0,0,S,108);ctx.fillStyle=T.textMain;ctx.textAlign='center';ctx.font='bold 43px sans-serif';ctx.fillText(month+'/'+day+'の予約空き状況',400,70);ctx.textAlign='left';ctx.fillStyle=T.badgeBg;ctx.fillRect(34,128,5,38);ctx.fillStyle=T.textMain;ctx.font='bold 38px sans-serif';ctx.fillText(month+'/'+day+'（'+dow+'）',48,163);let y=184;if(G.am.length)y=drawGroupV2(ctx,G.am,'午前',y,T,L);if(G.am.length&&G.pm.length)y+=10;if(G.pm.length)y=drawGroupV2(ctx,G.pm,'午後',y,T,L);const by=y+14;ctx.fillStyle=T.badgeBg;rrPath(ctx,34,by,246,50,25);ctx.fill();ctx.fillStyle=T.badgeText;ctx.textAlign='center';ctx.font='bold 26px sans-serif';ctx.fillText('✓ 空いています',157,by+33);ctx.textAlign='left';ctx.fillStyle=T.textSub;ctx.font='bold 24px sans-serif';ctx.fillText('当日予約もOKです',302,by+32);const px=22,py=by+64,pw=756,fy=732,ph=Math.max(105,fy-py-12),photo=new Image();photo.onload=()=>{ctx.save();rrPath(ctx,px,py,pw,ph,18);ctx.clip();const ir=photo.naturalWidth/photo.naturalHeight,br=pw/ph;let sw,sh,sx,sy;if(ir>br){sh=photo.naturalHeight;sw=sh*br;sy=0;sx=(photo.naturalWidth-sw)/2}else{sw=photo.naturalWidth;sh=sw/br;sx=0;sy=(photo.naturalHeight-sh)/2}ctx.drawImage(photo,sx,sy,sw,sh,px,py,pw,ph);ctx.restore();finishYoyaku(ctx,S,month,day,dateVal,T,'yCanvas','yPreview','yDlBtn')};photo.onerror=()=>finishYoyaku(ctx,S,month,day,dateVal,T,'yCanvas','yPreview','yDlBtn');photo.src='data:image/jpeg;base64,'+PHOTO_B64}
function finishYoyaku(ctx,S,month,day,dateVal,T,cid,pid,bid){const y=S-60;ctx.fillStyle='rgba(255,255,255,.94)';rrPath(ctx,52,y,S-104,44,22);ctx.fill();ctx.fillStyle=T.badgeText;ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText('ご予約・お問い合わせをお待ちしております',S/2,y+29);showPreview(cid,pid,bid,dateVal)}
