<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約画像ジェネレーター v2 TEST</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#16213e}#tag{position:fixed;z-index:9;right:8px;top:8px;background:#d95f02;color:#fff;padding:6px 9px;border-radius:8px;font:700 11px sans-serif;opacity:.9}</style></head><body><div id="tag">V2 ORANGE</div><iframe id="app" src="yoyaku_status_generator.html?v=5"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=w.document;d.querySelectorAll('.hint-row').forEach(e=>{if(e.textContent.includes('LINE VOOM'))e.remove()});function install(){if(typeof w.getTheme!=='function'||typeof w.rrPath!=='function'||typeof w.showPreview!=='function'){setTimeout(install,80);return}w.eval(`
function compactV2(t){const m=String(t).match(/(\\d{1,2})時(?:(\\d{1,2})分)?/);return m?Number(m[1])+':'+String(m[2]||'00').padStart(2,'0'):String(t)}
function minsV2(t){const m=String(t).match(/(\\d{1,2})時(?:(\\d{1,2})分)?/);return m?Number(m[1])*60+Number(m[2]||0):9999}
function groupV2(){const s=[...selTimes].sort((a,b)=>minsV2(a)-minsV2(b)),am=[],pm=[];s.forEach(t=>(timeType[t]==='am'||(timeType[t]!=='pm'&&minsV2(t)<780)?am:pm).push(t));return {am,pm}}
function layoutV2(n){if(n<=4)return{h:68,f:35,g:11};if(n<=8)return{h:62,f:33,g:10};if(n<=15)return{h:54,f:30,g:9};return{h:46,f:29,g:8}}
function drawGroupV2(ctx,a,label,y,T,L){if(!a.length)return y;const x=34,W=732,c=Math.min(4,a.length),rows=Math.ceil(a.length/c),cw=(W-L.g*(c-1))/c;ctx.fillStyle='rgba(255,255,255,.97)';rrPath(ctx,x,y,100,26,13);ctx.fill();ctx.fillStyle=T.badgeText;ctx.textAlign='center';ctx.font='bold 17px sans-serif';ctx.fillText(label,x+50,y+19);const gy=y+31;a.forEach((t,i)=>{const col=i%c,row=Math.floor(i/c),cx=x+col*(cw+L.g),cy=gy+row*(L.h+L.g);ctx.fillStyle='rgba(255,255,255,.98)';rrPath(ctx,cx,cy,cw,L.h,12);ctx.fill();ctx.fillStyle=T.badgeText;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+L.f+'px sans-serif';ctx.fillText(compactV2(t),cx+cw/2,cy+L.h/2)});ctx.textBaseline='alphabetic';return gy+rows*L.h+(rows-1)*L.g}
function generateYoyaku(){const dateVal=document.getElementById('yDate').value;if(!dateVal){alert('日付を入力してください');return}if(!selTimes.length){alert('空き時間を選んでください');return}const d=new Date(dateVal),month=d.getMonth()+1,day=d.getDate(),dow=DAY_NAMES[d.getDay()],S=800,c=document.getElementById('yCanvas');c.width=S;c.height=S;const ctx=c.getContext('2d'),T={bg1:'#F59E42',bg2:'#D95F02',headerBg:'#C94F00',textMain:'#FFFFFF',badgeBg:'#FFF3E6',badgeText:'#9A3D00',textSub:'#FFFFFF'},G=groupV2(),L=layoutV2(selTimes.length),grad=ctx.createRadialGradient(160,80,0,400,400,850);grad.addColorStop(0,T.bg1);grad.addColorStop(1,T.bg2);ctx.fillStyle=grad;ctx.fillRect(0,0,S,S);ctx.fillStyle=T.headerBg;ctx.fillRect(0,0,S,100);ctx.fillStyle=T.textMain;ctx.textAlign='center';ctx.font='bold 43px sans-serif';ctx.fillText(month+'/'+day+'の予約空き状況',400,65);ctx.textAlign='left';ctx.fillStyle='#FFD4B0';ctx.fillRect(34,114,5,35);ctx.fillStyle=T.textMain;ctx.font='bold 35px sans-serif';ctx.fillText(month+'/'+day+'（'+dow+'）',48,146);let y=162;if(G.am.length)y=drawGroupV2(ctx,G.am,'午前',y,T,L);if(G.am.length&&G.pm.length)y+=5;if(G.pm.length)y=drawGroupV2(ctx,G.pm,'午後',y,T,L);const by=y+8;ctx.fillStyle=T.badgeBg;rrPath(ctx,34,by,245,44,22);ctx.fill();ctx.fillStyle=T.badgeText;ctx.textAlign='center';ctx.font='bold 24px sans-serif';ctx.fillText('✓ 空いています',157,by+30);ctx.textAlign='left';ctx.fillStyle=T.textSub;ctx.font='bold 22px sans-serif';ctx.fillText('当日予約もOKです',300,by+29);const px=22,py=by+52,pw=756,footerY=754,ph=Math.max(0,footerY-py-8),photo=new Image();const done=()=>{ctx.fillStyle='rgba(255,255,255,.96)';rrPath(ctx,52,754,696,36,18);ctx.fill();ctx.fillStyle=T.badgeText;ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('ご予約・お問い合わせをお待ちしております',400,779);showPreview('yCanvas','yPreview','yDlBtn',dateVal)};photo.onload=()=>{if(ph>=48){ctx.save();rrPath(ctx,px,py,pw,ph,14);ctx.clip();const ir=photo.naturalWidth/photo.naturalHeight,br=pw/ph;let sw,sh,sx,sy;if(ir>br){sh=photo.naturalHeight;sw=sh*br;sy=0;sx=(photo.naturalWidth-sw)/2}else{sw=photo.naturalWidth;sh=sw/br;sx=0;sy=(photo.naturalHeight-sh)/2}ctx.drawImage(photo,sx,sy,sw,sh,px,py,pw,ph);ctx.restore()}done()};photo.onerror=done;photo.src='data:image/jpeg;base64,'+PHOTO_B64}
`);const b=d.querySelector('button[onclick="generateYoyaku()"]');if(b)b.textContent='🎨 予約空き状況の画像を生成（オレンジ統一版）'}install()};</script></body></html>
