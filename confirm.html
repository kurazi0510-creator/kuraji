<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>予約確認 - 倉治整骨院</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}
body{background:#faf6f0;color:#3d3226;min-height:100vh;padding-bottom:40px;}
.header{background:linear-gradient(135deg,#c98a4b,#e0a86a);color:#fff;padding:22px 16px 18px;text-align:center;}
.header h1{font-size:1.1rem;font-weight:bold;margin-bottom:4px;}
.header p{font-size:.75rem;opacity:.95;}
.wrap{max-width:480px;margin:0 auto;padding:14px;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(120,90,50,.08);}
label{display:block;font-size:.76rem;color:#8a7860;font-weight:bold;margin-bottom:6px;}
input{width:100%;border:1.6px solid #ecdfd0;border-radius:9px;padding:11px 12px;font-size:.95rem;background:#fffdfb;color:#3d3226;}
input:focus{outline:none;border-color:#c98a4b;}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;font-size:.9rem;font-weight:bold;cursor:pointer;margin-top:10px;background:#c98a4b;color:#fff;}
.btn:disabled{background:#e5d9c8;color:#b3a48c;}
.result-item{background:#fdf8f2;border:1.5px solid #f0e2cf;border-radius:11px;padding:14px;margin-bottom:10px;}
.result-item .d{font-size:.95rem;font-weight:bold;color:#c98a4b;margin-bottom:4px;}
.result-item .n{font-size:.82rem;color:#3d3226;}
.result-item .m{font-size:.78rem;color:#8a7860;margin-top:4px;}
.empty{text-align:center;padding:24px 10px;color:#a08a6d;font-size:.85rem;}
.err{background:#fdecec;color:#b3382c;border-radius:9px;padding:10px 12px;font-size:.8rem;margin-top:10px;display:none;}
.notice{background:#eef8ef;color:#276337;border-radius:9px;padding:10px 12px;font-size:.8rem;margin-top:10px;display:none;line-height:1.7}
.section-title{font-size:1rem;margin:20px 0 10px}.pending{border-color:#e9b963;background:#fff9e9}.status{font-size:.8rem;font-weight:bold;margin-bottom:8px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <h1>📋 ご予約内容の確認</h1>
  <p>LINEにお届けする確認コードで、ご本人確認を行います</p>
</div>
<div class="wrap">
  <div class="card">
    <label>お電話番号</label>
    <input type="tel" id="tel" placeholder="09012345678" inputmode="numeric" autocomplete="tel">
    <button class="btn" id="btn" onclick="requestCode()">確認コードをLINEへ送る</button>
    <div id="codeBox" style="display:none;margin-top:14px">
      <label>LINEに届いた8文字の確認コード</label>
      <input id="code" inputmode="text" autocomplete="one-time-code" maxlength="8" placeholder="例：A1B2C3D4">
      <button class="btn" id="verifyBtn" onclick="search()">予約を確認する</button>
    </div>
    <p style="font-size:.75rem;color:#8a7860;margin-top:10px;line-height:1.7">確認コードは5分間有効です。コードを受け取ったらLINEからこの画面へ戻って入力してください。連携がまだの方・コードが届かない方は、院へLINEまたはお電話でお問い合わせください。</p>
    <div class="notice" id="notice" role="status"></div>
    <div class="err" id="err"></div>
  </div>
  <div id="results"></div>
</div>
<script>
const GAS='https://script.google.com/macros/s/AKfycbxN8GuaDOG2WnR9OiJINtqoMOz2guWn-TrmRlkLQIs3QAvuLZxDh1obSNGDbpFto2oltg/exec';
let lookupRun=0;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function requestCode(){
  const run=++lookupRun;
  const tel=document.getElementById('tel').value.replace(/[^0-9]/g,'');
  const btn=document.getElementById('btn'),err=document.getElementById('err');
  err.style.display='none';
  document.getElementById('results').replaceChildren();
  document.getElementById('notice').style.display='none';
  document.getElementById('code').value='';
  if(!/^0\d{9,10}$/.test(tel)){err.textContent='電話番号を正しく入力してください';err.style.display='block';return;}
  btn.disabled=true;
  try{
    const r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'requestBookingLookupCode',tel})});
    const d=await r.json();
    if(run!==lookupRun)return;
    if(!d.ok)throw new Error(d.error||'送信できませんでした');
    document.getElementById('codeBox').style.display='block';
    const notice=document.getElementById('notice');notice.textContent=d.message;notice.style.display='block';
  }catch(e){err.textContent='送信できませんでした。院へお問い合わせください。';err.style.display='block';}
  finally{btn.disabled=false;}
}
async function search(){
  const run=++lookupRun;
  const tel=document.getElementById('tel').value.replace(/[^0-9]/g,'');
  const code=document.getElementById('code').value.trim();
  const btn=document.getElementById('verifyBtn'), err=document.getElementById('err'), res=document.getElementById('results');
  err.style.display='none'; res.innerHTML='';
  if(!/^0\d{9,10}$/.test(tel)){ err.textContent='電話番号を正しく入力してください'; err.style.display='block'; return; }
  if(!/^[0-9A-F]{8}$/i.test(code)){err.textContent='LINEに届いた8文字の確認コードを入力してください';err.style.display='block';return;}
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>確認中...';
  try{
    const r=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'verifyBookingLookupCode',tel,code})});
    const d=await r.json();
    if(run!==lookupRun){btn.disabled=false;btn.textContent='予約を確認する';return;}
    if(!d.ok){ err.textContent='⚠️ '+(d.error||'確認に失敗しました'); err.style.display='block'; }
    else if(d.needsLink){
      res.innerHTML='<div class="card empty">予約確認の連携がまだ完了していません。院へお問い合わせください。</div>';
    }else if(!d.list?.length && !d.requests?.length){
      res.innerHTML='<div class="card empty">現在、今後のご予約・確認待ちのリクエストは見つかりませんでした。<br>直近の変更やご不明な点は、院へお問い合わせください。</div>';
    }else{
      res.innerHTML=(d.list?.length?'<h2 class="section-title">確定したご予約</h2>':'')+(d.list||[]).map(b=>{
        const dd=new Date(b.date);
        const disp=isNaN(dd.getTime())?b.date:dd.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
        return `<div class="result-item"><div class="status">予約確定</div><div class="d">${escapeHtml(disp)} ${escapeHtml(b.time)}〜</div><div class="n">${escapeHtml(b.name)} 様</div><div class="m">${escapeHtml(b.menu||'')}</div></div>`;
      }).join('')+(d.requests?.length?'<h2 class="section-title">確認待ちの予約リクエスト</h2><p style="font-size:.8rem;margin-bottom:10px">以下は希望日時です。まだ予約は確定していません。</p>':'')+(d.requests||[]).map(b=>`<div class="result-item pending"><div class="status">受付済み・未確定</div><div class="n">${escapeHtml(b.name)} 様</div><div class="m">${escapeHtml(b.menu)}</div>${b.candidates.map(c=>`<div class="m">第${escapeHtml(c.order)}希望：${escapeHtml(c.date)} ${escapeHtml(c.time)}〜</div>`).join('')}</div>`).join('');
    }
  }catch(e){
    err.textContent='⚠️ 通信エラーが発生しました'; err.style.display='block';
  }
  btn.disabled=false; btn.textContent='予約を確認する';
}
document.getElementById('tel').addEventListener('input',()=>{
  lookupRun++;
  document.getElementById('results').replaceChildren();document.getElementById('codeBox').style.display='none';document.getElementById('notice').style.display='none';document.getElementById('code').value='';
});
window.addEventListener('pagehide',()=>{lookupRun++;document.getElementById('results').replaceChildren();document.getElementById('code').value='';});
</script>
</body>
</html>
