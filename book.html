<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ご予約 - 倉治整骨院</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}
body{background:#faf6f0;color:#3d3226;min-height:100vh;padding-bottom:40px;}
.header{background:linear-gradient(135deg,#c98a4b,#e0a86a);color:#fff;padding:22px 16px 18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.header h1{font-size:1.15rem;font-weight:bold;margin-bottom:4px;}
.header p{font-size:.75rem;opacity:.95;}
.wrap{max-width:520px;margin:0 auto;padding:14px;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(120,90,50,.08);}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#c98a4b;color:#fff;font-size:.72rem;font-weight:bold;margin-right:6px;}
.card h2{font-size:.92rem;color:#3d3226;margin-bottom:10px;display:flex;align-items:center;}
label{display:block;font-size:.76rem;color:#8a7860;font-weight:bold;margin:10px 0 4px;}
label:first-child{margin-top:0;}
input[type=text],input[type=tel],input[type=date],textarea,select{width:100%;border:1.6px solid #ecdfd0;border-radius:9px;padding:11px 12px;font-size:.9rem;background:#fffdfb;color:#3d3226;}
input:focus,textarea:focus,select:focus{outline:none;border-color:#c98a4b;}
textarea{resize:none;height:64px;}
.req{color:#d9534f;font-size:.68rem;margin-left:4px;}
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.slot-sec{font-size:.72rem;color:#a08a6d;font-weight:bold;margin:10px 0 4px;}
.slot{padding:8px 2px;text-align:center;border:1.6px solid #ecdfd0;border-radius:8px;font-size:.74rem;color:#3d3226;background:#fffdfb;cursor:pointer;}
.slot.full{background:#f2ede6;color:#c4b8a5;text-decoration:line-through;cursor:not-allowed;}
.slot.sel{background:#c98a4b;color:#fff;border-color:#c98a4b;font-weight:bold;}
.menu-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.menu-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.6px solid #ecdfd0;border-radius:9px;font-size:.84rem;cursor:pointer;}
.menu-item.on{background:#fdf3e7;border-color:#c98a4b;}
.menu-item input{width:auto;}
.menu-item .time{margin-left:auto;color:#a08a6d;font-size:.75rem;white-space:nowrap;}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:11px;font-size:.95rem;font-weight:bold;cursor:pointer;margin-top:6px;}
.btn-main{background:#c98a4b;color:#fff;}
.btn-main:disabled{background:#e5d9c8;color:#b3a48c;}
.note{font-size:.72rem;color:#a08a6d;line-height:1.7;margin-top:8px;}
.done{text-align:center;padding:20px 10px;}
.done .ok{font-size:2.4rem;margin-bottom:8px;}
.done h2{font-size:1.05rem;margin-bottom:8px;color:#3d3226;}
.done p{font-size:.82rem;color:#6b5c47;line-height:1.8;margin-bottom:14px;white-space:pre-wrap;}
.line-box{background:#eaf9ec;border:1.5px solid #b6e6bd;border-radius:12px;padding:14px;text-align:left;font-size:.8rem;color:#2f6b3a;line-height:1.8;margin-top:10px;}
.line-box b{color:#1f7d33;}
.err{background:#fdecec;color:#b3382c;border-radius:9px;padding:10px 12px;font-size:.8rem;margin-top:10px;display:none;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <h1>🌿 倉治整骨院 ご予約フォーム</h1>
  <p>ご希望のメニュー・日時をお選びください</p>
</div>
<div class="wrap" id="formWrap">

  <div class="card">
    <h2><span class="step-num">1</span>ご希望メニュー</h2>
    <div class="menu-list" id="menuArea"></div>
  </div>

  <div class="card" id="dateCard" style="display:none">
    <h2><span class="step-num">2</span>ご希望日</h2>
    <input type="date" id="f-date" onchange="onDateChange()">
  </div>

  <div class="card" id="slotCard" style="display:none">
    <h2><span class="step-num">3</span>ご希望のお時間</h2>
    <div id="slotArea"><p class="note">日付を選択すると空き状況が表示されます</p></div>
  </div>

  <div class="card" id="infoCard" style="display:none">
    <h2><span class="step-num">4</span>お客様情報</h2>
    <label>お名前<span class="req">必須</span></label>
    <input type="text" id="f-name" placeholder="山田 太郎">
    <label>お電話番号<span class="req">必須</span></label>
    <input type="tel" id="f-tel" placeholder="09012345678" inputmode="numeric">
    <label>メールアドレス（お持ちの方は入力ください・LINEをお使いでない方はこちらに確認メールが届きます）</label>
    <input type="text" id="f-email" placeholder="example@mail.com" inputmode="email">
    <label>診察券No（お持ちの方のみ）</label>
    <input type="text" id="f-card" placeholder="例：0123">
    <label>症状・ご要望（任意）</label>
    <textarea id="f-sym" placeholder="腰が痛い、初めてなので相談したい　など"></textarea>
    <div class="err" id="errBox"></div>
    <button class="btn btn-main" id="submitBtn" onclick="submitBooking()" disabled>この内容で予約する</button>
    <p class="note">※ 送信後、内容を確認しお電話でご連絡させていただく場合がございます。</p>
  </div>
</div>

<div class="wrap" id="doneWrap" style="display:none">
  <div class="card done">
    <div class="ok">✅</div>
    <h2>ご予約を受け付けました</h2>
    <p id="doneSummary"></p>
    <div class="line-box">
      <b>📱 LINEで前日リマインドを受け取る（任意）</b><br><br>
      LINEで倉治整骨院を友だち追加しておくと、前日にリマインドが届きます(お名前でお呼びしています)。
    </div>
    <a id="lineAddBtn" href="#" target="_blank" style="display:block;margin-top:12px">
      <button class="btn" style="background:#06c755;color:#fff">LINEで倉治整骨院を友だち追加</button>
    </a>
    <a href="confirm.html" style="display:block;margin-top:8px">
      <button class="btn" style="background:#fff;color:#c98a4b;border:2px solid #c98a4b">📋 あとで予約内容を確認する</button>
    </a>
  </div>
</div>

<script>
// ▼▼▼ 設定 ▼▼▼
const GAS='https://script.google.com/macros/s/AKfycbyKj_YkWdU747zl6IcanFsI1-O2IBUDli8wMSRnAJUfYEptCexelUHgl4uYnDiNwYnEqg/exec';
const LINE_ADD_URL='https://line.me/R/ti/p/@qin9307o';
// ▲▲▲ ここまで ▲▲▲

const SLOTS=['08:30','08:50','09:10','09:30','09:50','10:10','10:30','10:50',
  '11:10','11:30','11:50','12:10','15:00','15:20','15:40','16:00',
  '16:20','16:40','17:00','17:20','17:40','18:00','18:20','18:40',
  '19:00','19:20','19:40'];

// 曜日ごとの診療ルール（GASの営業時間設定を反映。未取得時は従来のデフォルトにフォールバック）
let bizHoursCache=null;
async function loadBizHours(){
  try{
    const res=await fetch(GAS+'?action=getBizHours&t='+Date.now(),{cache:'no-store'});
    const d=await res.json();
    if(d.ok) bizHoursCache={weekly:d.weekly||[], overrides:d.overrides||[]};
  }catch(e){ bizHoursCache=null; }
}
function genSlots(startStr,endStr){
  if(!startStr||!endStr) return [];
  if(!/^\d{1,2}:\d{2}$/.test(startStr)||!/^\d{1,2}:\d{2}$/.test(endStr)) return [];
  let [h,m]=startStr.split(':').map(Number);
  const [eh,em]=endStr.split(':').map(Number);
  if(isNaN(h)||isNaN(m)||isNaN(eh)||isNaN(em)) return [];
  const out=[]; let guard=0;
  while(!(h===eh&&m===em)&&guard<100){
    const s=(h<10?'0'+h:h)+':'+(m<10?'0'+m:m);
    if(SLOTS.includes(s)) out.push(s);
    m+=20; if(m>=60){m-=60;h++;}
    guard++;
  }
  return out;
}
function toHHMM(v){
  if(v===null||v===undefined||v==='') return '';
  const m=String(v).match(/(\d{1,2}):(\d{2})/);
  if(m) return (m[1].length<2?'0'+m[1]:m[1])+':'+m[2];
  return '';
}
function getDayConfig(dateStr){
  if(bizHoursCache){
    const ov=bizHoursCache.overrides.find(r=>String(r[0])===dateStr);
    if(ov) return {closed: ov[1]===true||ov[1]==='TRUE', am:[toHHMM(ov[2]),toHHMM(ov[3])], pm:[toHHMM(ov[4]),toHHMM(ov[5])]};
    const dow=new Date(dateStr+'T00:00:00').getDay();
    const wk=bizHoursCache.weekly.find(r=>Number(r[0])===dow);
    if(wk){
      const closed=wk[1]===true||wk[1]==='TRUE';
      return {closed, am:[toHHMM(wk[2]),toHHMM(wk[3])], pm:[toHHMM(wk[4]),toHHMM(wk[5])]};
    }
  }
  // フォールバック（従来のデフォルト：日曜休診、木・土は午前のみ）
  const dow=new Date(dateStr+'T00:00:00').getDay();
  if(dow===0) return {closed:true, am:null, pm:null};
  if(dow===4||dow===6) return {closed:false, am:['08:30','12:30'], pm:null};
  return {closed:false, am:['08:30','12:30'], pm:['15:00','20:00']};
}
function slotsForDay(dateStr){
  const cfg=getDayConfig(dateStr);
  if(cfg.closed) return [];
  const mo=genSlots(cfg.am&&cfg.am[0],cfg.am&&cfg.am[1]);
  const af=genSlots(cfg.pm&&cfg.pm[0],cfg.pm&&cfg.pm[1]);
  return [...mo,...af];
}
loadBizHours();

// メニュー：所要時間(分) と 必要枠数(1枠=20分)
const MENUS=[
  {key:'sotai_first', label:'整体（初診）', minutes:60, slots:3},
  {key:'sotai_repeat',label:'整体（再診）', minutes:40, slots:2},
  {key:'raku_first',  label:'楽トレ（初診）', minutes:40, slots:2},
  {key:'raku_repeat', label:'楽トレ（再診）', minutes:40, slots:2},
  {key:'bigan_first', label:'美顔整顔（初診）', minutes:60, slots:3},
  {key:'bigan_repeat',label:'美顔整顔（再診）', minutes:40, slots:2},
  {key:'kotsu_first', label:'交通事故（初診）', minutes:60, slots:3},
  {key:'kotsu_repeat',label:'交通事故（再診）', minutes:20, slots:1},
];

let bookedSlots={}, selMenu=null, selSlot='';

document.getElementById('menuArea').innerHTML=MENUS.map((m,i)=>
  `<label class="menu-item" id="mi-${i}"><input type="radio" name="menu" onchange="pickMenu(${i})"> ${m.label}<span class="time">${m.minutes}分</span></label>`
).join('');
function pickMenu(i){
  selMenu=MENUS[i];
  MENUS.forEach((m,j)=>document.getElementById('mi-'+j).classList.toggle('on',j===i));
  document.getElementById('dateCard').style.display='block';
  document.getElementById('slotCard').style.display='none';
  document.getElementById('infoCard').style.display='none';
  selSlot='';
  const dEl=document.getElementById('f-date');
  if(dEl.value) onDateChange();
}

// 日付の下限＝今日、上限＝60日後
(function(){
  const d=document.getElementById('f-date');
  const t=new Date(),max=new Date();max.setDate(t.getDate()+60);
  d.min=t.toISOString().slice(0,10);
  d.max=max.toISOString().slice(0,10);
})();

let currentDate='', currentCfg=null;
async function onDateChange(){
  const date=document.getElementById('f-date').value;
  if(!date||!selMenu)return;
  document.getElementById('slotCard').style.display='block';
  if(!bizHoursCache) await loadBizHours();
  const cfg=getDayConfig(date);
  currentDate=date; currentCfg=cfg;
  if(cfg.closed){
    document.getElementById('slotArea').innerHTML='<p class="note" style="color:#b3382c;font-weight:bold">😌 申し訳ございません、本日は休診日です。別の日をお選びください。</p>';
    selSlot=''; checkReady();
    return;
  }
  document.getElementById('slotArea').innerHTML='<p class="note">読み込み中...</p>';
  try{
    const res=await fetch(GAS+'?action=getAll&t='+Date.now(),{cache:'no-store'});
    const d=await res.json();
    bookedSlots={};
    (d.bookings||[]).forEach((row,i)=>{
      if(i===0)return; // header
      if(String(row[0])===date && String(row[3]||'').trim()!=='') bookedSlots[String(row[1])]=true;
    });
  }catch(e){ bookedSlots={}; }
  renderSlots(date,cfg);
}

// 開始時刻sから、selMenu.slots個ぶん連続して空いているか（診療時間内かどうか・午前午後をまたがないか）を判定
function canStartAt(startIdx,availSlots){
  const need=selMenu.slots;
  const startsAM = SLOTS[startIdx] < '13:00';
  for(let k=0;k<need;k++){
    const idx=startIdx+k;
    if(idx>=SLOTS.length) return false;
    const s=SLOTS[idx];
    if(!availSlots.includes(s)) return false; // 診療時間外
    if(startsAM && s>='13:00') return false; // 午前→午後をまたぐ
    if(bookedSlots[s]) return false;
  }
  return true;
}

function renderSlots(dateStr,cfg){
  const availSlots=slotsForDay(dateStr);
  const hasAM=cfg.am&&cfg.am[0], hasPM=cfg.pm&&cfg.pm[0];
  const am=SLOTS.filter(s=>s<'13:00'), pm=SLOTS.filter(s=>s>='13:00');
  let html=`<p class="note">所要時間：${selMenu.minutes}分（${selMenu.slots}枠）${!hasPM?'　※本日は午前診療のみです':(!hasAM?'　※本日は午後診療のみです':'')}</p>`;
  if(hasAM) html+='<div class="slot-sec">午前</div><div class="slot-grid">'+am.map(s=>slotHtml(s,availSlots)).join('')+'</div>';
  if(hasPM) html+='<div class="slot-sec">午後</div><div class="slot-grid">'+pm.map(s=>slotHtml(s,availSlots)).join('')+'</div>';
  document.getElementById('slotArea').innerHTML=html;
}
function slotHtml(s,availSlots){
  const idx=SLOTS.indexOf(s);
  const ok=canStartAt(idx,availSlots);
  return `<div class="slot ${ok?'':'full'} ${selSlot===s?'sel':''}" ${ok?`onclick="pickSlot('${s}')"`:''}>${s}</div>`;
}
function pickSlot(s){ selSlot=s; renderSlots(currentDate,currentCfg); checkReady(); document.getElementById('infoCard').style.display='block'; }

document.addEventListener('input',checkReady);
function checkReady(){
  const name=document.getElementById('f-name')?.value.trim();
  const tel=document.getElementById('f-tel')?.value.replace(/[^0-9]/g,'');
  const ok=selMenu && selSlot && name && tel && tel.length>=10;
  document.getElementById('submitBtn').disabled=!ok;
}

async function submitBooking(){
  const btn=document.getElementById('submitBtn');
  const date=document.getElementById('f-date').value;
  const name=document.getElementById('f-name').value.trim();
  const tel=document.getElementById('f-tel').value.replace(/[^0-9\-]/g,'');
  const email=document.getElementById('f-email').value.trim();
  const cardId=document.getElementById('f-card').value.trim();
  const sym=document.getElementById('f-sym').value.trim();
  const errBox=document.getElementById('errBox');
  errBox.style.display='none';
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>送信中...';
  try{
    const res=await fetch(GAS,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'saveWebBooking',data:{
        date,time:selSlot,name,tel,email,cardId,symptom:sym,
        menu:selMenu.label,slotsNeeded:selMenu.slots
      }})
    });
    const d=await res.json();
    if(!d.ok){
      errBox.textContent='⚠️ '+(d.error||'送信に失敗しました。恐れ入りますがお電話にてご予約ください。');
      errBox.style.display='block';
      btn.disabled=false; btn.innerHTML='この内容で予約する';
      onDateChange();
      return;
    }
    document.getElementById('doneSummary').textContent=`${date} ${selSlot}〜（${selMenu.minutes}分）\n${selMenu.label}\n${name} 様`;
    document.getElementById('lineAddBtn').href=LINE_ADD_URL;
    document.getElementById('formWrap').style.display='none';
    document.getElementById('doneWrap').style.display='block';
    window.scrollTo(0,0);
  }catch(e){
    errBox.textContent='⚠️ 通信エラーが発生しました。お手数ですがお電話でご予約ください。';
    errBox.style.display='block';
    btn.disabled=false; btn.innerHTML='この内容で予約する';
  }
}
</script>
</body>
</html>
