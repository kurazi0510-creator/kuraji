<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GASコード - 倉治整骨院</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Hiragino Sans',sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;}
.card{background:#1e293b;border-radius:12px;padding:20px;max-width:600px;margin:0 auto;}
h1{color:#f97316;font-size:1rem;text-align:center;margin-bottom:8px;}
.step{background:#1e3a5f;border-radius:8px;padding:12px 14px;margin:10px 0;font-size:0.8rem;color:#7dd3fc;line-height:2;}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;margin-bottom:10px;}
.btn-copy{background:#f97316;color:white;}
.btn-back{background:#374151;color:#94a3b8;}
#status{padding:12px;border-radius:8px;text-align:center;font-size:0.82rem;display:none;margin-bottom:10px;background:#dcfce7;color:#166534;}
#status.ng{background:#fee2e2;color:#dc2626;}
</style>
</head>
<body>
<div class="card">
  <h1>⚙️ GASコード更新</h1>
  <div class="step">
    <strong>【手順】</strong><br>
    ① 「📋 コピー」ボタンを押す（GitHubから最新版を取得します）<br>
    ② <a href="https://script.google.com" target="_blank" style="color:#60a5fa">script.google.com</a> を開く<br>
    ③ コード.gs → <kbd>Ctrl+A</kbd> → <kbd>Delete</kbd> → <kbd>Ctrl+V</kbd> → <kbd>Ctrl+S</kbd><br>
    ④ デプロイ → デプロイを管理 → 鉛筆 → 新しいバージョン → デプロイ
  </div>
  <div id="status"></div>
  <button class="btn btn-copy" id="copybtn" onclick="copyGAS()">📋 最新のGASコードを取得してコピー</button>
  <button class="btn btn-back" onclick="location.href='kanri.html'">← 管理システムに戻る</button>
</div>
<script>
// ★このファイル自体にコードを埋め込むと、更新のたびに手動で同期しないと古いまま残ってしまう
//   （実際に、以前ここには半年以上前の古いコードと、漏えいしたLINEトークンが埋め込まれたままになっていた）。
//   そのため、常にGitHub上の最新のgas_full_v5.gsをその場で取得する方式に変更した。
const SOURCE_URL='https://raw.githubusercontent.com/kurazi0510-creator/kuraji/main/gas_full_v5.gs';

async function copyGAS(){
  const st=document.getElementById('status');
  const btn=document.getElementById('copybtn');
  st.className='';st.style.display='block';st.textContent='📥 GitHubから最新版を取得中...';
  try{
    const res=await fetch(SOURCE_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const code=await res.text();
    try{
      await navigator.clipboard.writeText(code);
    }catch(e){
      const ta=document.createElement('textarea');
      ta.value=code;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    st.className='';st.textContent='✅ 最新版をコピーしました！Apps Scriptに貼り付けてください。';
    btn.textContent='✅ コピー済み！';
    btn.style.background='#22c55e';
  }catch(e){
    st.className='ng';st.textContent='❌ 取得に失敗しました：'+e.message+'（通信環境をご確認のうえ、もう一度お試しください）';
  }
}
</script>
</body>
</html>
