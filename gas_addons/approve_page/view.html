<!DOCTYPE html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8">
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;background:#f3f5f4;color:#222}
h1{font-size:18px;margin:0;padding:14px 16px;background:#37474f;color:#fff}
.note{padding:10px 16px;font-size:13px;color:#555}
.card{background:#fff;margin:10px 12px;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nm{font-size:16px;font-weight:bold}.meta{font-size:13px;color:#555;margin:4px 0;line-height:1.6}
.st{display:inline-block;font-size:12px;padding:2px 10px;border-radius:10px;background:#eceff1;color:#37474f;margin-left:6px}
.st.sent{background:#e8f5e9;color:#2e7d32}.st.stop{background:#ffebee;color:#b00020}.st.wait{background:#fff8e1;color:#8a6d00}
.date{padding:8px 16px 0;font-size:13px;font-weight:bold;color:#37474f}
details summary{font-size:13px;color:#1565c0;margin-top:6px}
pre{white-space:pre-wrap;font:14px/1.5 inherit;margin:6px 0 0}
input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #bbb}
button{background:#37474f;color:#fff;border:0}
.err{color:#b00020;padding:10px 16px}
</style></head><body>
<h1>再来院フォロー 候補一覧（見るだけ）</h1>
<div id="login" class="note">閲覧パスワード：<input id="pin" type="password" autocomplete="current-password"> <button onclick="go()">見る</button><div id="e" class="err"></div></div>
<div class="note" id="info" style="display:none">直近7日分です。送信するかどうかは院長が決めます。この画面では送信・編集はできません。</div>
<div id="list"></div>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(){
  var pin=document.getElementById('pin').value;
  document.getElementById('e').textContent='確認中…';
  google.script.run.withSuccessHandler(function(items){
    document.getElementById('login').style.display='none';
    document.getElementById('info').style.display='block';
    render(items);
  }).withFailureHandler(function(e){document.getElementById('e').textContent=e.message||e}).apView(pin);
}
document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
function cls(s){return s.indexOf('送信済み')===0?'sent':(s.indexOf('送信中止')===0||s.indexOf('送信失敗')===0?'stop':(s.indexOf('待ち')>=0?'wait':''))}
function render(items){
  var el=document.getElementById('list');
  if(!items.length){el.innerHTML='<div class="card">直近7日に候補はありません。</div>';return}
  var h='',cur='';
  items.forEach(function(it){
    if(it.date!==cur){cur=it.date;h+='<div class="date">'+esc(cur)+(it.today?'（今日）':'')+'</div>'}
    h+='<div class="card"><div class="nm">'+esc(it.name)+'様<span class="st '+cls(it.status)+'">'+esc(it.status)+'</span></div>'
     +'<div class="meta">'+esc(it.timing)+'／前回来院 '+esc(it.prev)+'／次回予約：'+esc(it.next||'なし')+'</div>'
     +'<details><summary>送る文面を見る</summary><pre>'+esc(it.text)+'</pre></details></div>';
  });
  el.innerHTML=h;
}
</script></body></html>
