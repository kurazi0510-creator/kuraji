<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>問診票印刷 - 倉治整骨院</title>
<style>
@page{ size:A4; margin:15mm; }
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}
body{background:#e5e5e5;color:#222;}
.toolbar{position:sticky;top:0;background:#1e293b;padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:10;}
.toolbar button{padding:9px 18px;border:none;border-radius:8px;background:#c98a4b;color:#fff;font-weight:bold;font-size:.85rem;cursor:pointer;}
.toolbar span{color:#cbd5e1;font-size:.8rem;}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:16px auto;padding:15mm;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.title{text-align:center;font-size:26px;font-weight:bold;letter-spacing:9px;margin-bottom:8px;}
.clinic{text-align:right;font-size:15px;font-weight:bold;}
.datestamp{text-align:right;font-size:11px;color:#555;margin-bottom:12px;}
table.info{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14.5px;}
table.info th,table.info td{border:1px solid #333;padding:8px 10px;text-align:left;}
table.info th{background:#eee;width:16%;white-space:nowrap;}
.q{font-weight:bold;font-size:14.5px;margin:14px 0 5px;line-height:1.5;}
.q::before{content:"※  ";}
.a{font-size:14px;margin-bottom:4px;padding-left:18px;line-height:1.9;}
.hl{background:#fff2cc;padding:2px 6px;font-weight:bold;border:1.8px solid #000;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.section-line{border-top:1px solid #999;margin:14px 0 10px;}
.smallnote{font-size:10.5px;color:#666;margin-top:12px;line-height:1.6;}
@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0;}
}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨 このページを印刷（A4）</button>
  <span id="loadingMsg">読み込み中...</span>
</div>
<div class="sheet" id="sheet"></div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbxN8GuaDOG2WnR9OiJINtqoMOz2guWn-TrmRlkLQIs3QAvuLZxDh1obSNGDbpFto2oltg/exec';
const params=new URLSearchParams(location.search);
const rowIdx=params.get('id');

function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// mondo.htmlと同じ選択肢一覧（すべての選択肢を表示し、選んだものだけ強調するため）
const OPTS={
  sex:['男性','女性'],
  medYn:['なし','あり'],
  know:['紹介','ホームページ','LINE','インスタグラム','口コミ','チラシ','看板'],
  lineStatus:['登録済み','まだ（受付でご案内します）'],
  symptom:['疲労感','倦怠感','頭痛','眼精疲労','めまい','耳鳴り','不眠','首こり','首痛','肩こり','背中の痛み','腰痛','ぎっくり腰','坐骨神経痛','しびれ','だるさ','産後の骨盤矯正','顔の歪み','顎の歪み','顎の痛み','顎関節症','その他'],
  treatment:['投薬','湿布','牽引','電気','手術','その他'],
  alcohol:['しない','時々','毎日'],
  smoke:['しない','時々','毎日'],
  otherCond:['椎間板ヘルニア','顎関節症','アレルギー','喘息','気管支炎','肺炎','鼻炎','生理痛','生理不順','子宮筋腫','便秘','下痢','子宮内膜症','高血圧','低血圧','リウマチ','膀胱炎','胃痛','下肢静脈瘤','顔面神経痛','三叉神経痛'],
  pregnant:['はい','いいえ'],
  goal:['本日のみの施術を希望','つらい症状が改善すれば良い','定期的に加療したい'],
};
function mark(list,key){
  // 問診票と同じく、選択肢を全て表示し、選ばれたものだけ強調（〇）で示す
  const sel=(list||'').split('|').filter(Boolean);
  const opts=OPTS[key]||[];
  return opts.map(o=>sel.includes(o)?`<span class="hl">〇${esc(o)}</span>`:esc(o)).join('　');
}

async function load(){
  if(!rowIdx){ document.getElementById('loadingMsg').textContent='IDが指定されていません'; return; }
  try{
    const res=await fetch(GAS+'?action=getMondoshinById&rowIdx='+rowIdx+'&t='+Date.now(),{cache:'no-store'});
    const d=await res.json();
    if(!d.ok){ document.getElementById('loadingMsg').textContent='取得に失敗しました：'+(d.error||''); return; }
    render(d.data);
    document.getElementById('loadingMsg').textContent='読み込み完了';
  }catch(e){ document.getElementById('loadingMsg').textContent='通信エラー：'+e.message; }
}

function render(q){
  const dobDisp=q.dob?q.dob.replace(/-/g,'/'):'（未入力）';
  document.getElementById('sheet').innerHTML=`
    <div class="title">初 診 者 問 診 票</div>
    <div class="clinic">倉治整骨院</div>
    <div class="datestamp">Web問診票受信：${esc(q.createdAt)}</div>

    <table class="info">
      <tr><th>ふりがな</th><td>${esc(q.kana)}</td><th>生年月日</th><td>${dobDisp}</td></tr>
      <tr><th>氏名</th><td>${esc(q.name)}</td><th>性別</th><td>${mark(q.sex,'sex')}</td></tr>
      <tr><th>職業</th><td>${esc(q.job)}</td><th>携帯番号</th><td>${esc(q.tel)}</td></tr>
      <tr><th>住所</th><td colspan="3">${esc(q.addr)}</td></tr>
      <tr><th>自宅電話</th><td>${esc(q.telHome)}</td><th>緊急連絡先</th><td>${esc(q.emergency)}</td></tr>
    </table>

    <div class="q">現在服用中のお薬</div>
    <div class="a">${mark(q.medYn,'medYn')}　${q.medDetail?'（'+esc(q.medDetail)+'）':''}</div>

    <div class="q">当院を何でお知りになりましたか</div>
    <div class="a">${mark(q.know,'know')}</div>

    <div class="q">LINEのお友だち登録</div>
    <div class="a">${mark(q.lineStatus,'lineStatus')}</div>

    <div class="section-line"></div>

    <div class="q">現在の主な症状</div>
    <div class="a">${mark(q.symptom,'symptom')}</div>
    <div class="a">最も改善させたい症状：<span class="hl">${esc(q.symptomMain)||'（未入力）'}</span>／いつから：${esc(q.symptomSince)||'（未入力）'}</div>

    <div class="q">病院受診歴</div>
    <div class="a">病院名：${esc(q.hospital)||'（未入力）'}　診断名：${esc(q.diagnosis)||'（未入力）'}</div>
    <div class="a">治療内容：${mark(q.treatment,'treatment')}</div>

    <div class="q">一番つらい症状のために行っていること</div>
    <div class="a">${esc(q.effort)||'（未入力）'}</div>

    <div class="section-line"></div>

    <div class="q">飲酒・喫煙</div>
    <div class="a">飲酒：${mark(q.alcohol,'alcohol')}</div>
    <div class="a">喫煙：${mark(q.smoke,'smoke')}</div>

    <div class="q">その他の症状・既往症</div>
    <div class="a">${mark(q.otherCond,'otherCond')}</div>

    <div class="q">妊娠・手術・事故</div>
    <div class="a">妊娠：${mark(q.pregnant,'pregnant')}　／　手術・骨折歴：${esc(q.surgery)||'（なし）'}　／　事故歴：${esc(q.accident)||'（なし）'}</div>

    <div class="section-line"></div>

    <div class="q">今回の症状をどのようにしたいか</div>
    <div class="a">${mark(q.goal,'goal')}</div>

    <div class="section-line"></div>
    <p class="smallnote">※本用紙は患者様がWeb問診票にご入力いただいた内容を院内で印刷したものです。個人情報の取り扱いについては、事前にWeb画面上でご同意をいただいております。</p>
  `;
}
load();
</script>
</body>
</html>
