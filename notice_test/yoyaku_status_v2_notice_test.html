<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fffaf5;color:#33251c}.wrap{max-width:620px;margin:auto;padding:16px 12px 38px}.brand{text-align:center;color:#b65a16;font-weight:900;font-size:16px}.title{text-align:center;font-size:27px;margin:5px 0 3px}.updated{text-align:center;font-size:14px;font-weight:800;color:#765744;margin:0 0 12px}.status{background:#fff;border:1px solid #f1d6c1;border-radius:18px;padding:8px;box-shadow:0 5px 20px #7c3d1017}.status img{display:block;width:100%;height:auto;border-radius:12px}.loading{padding:45px 12px;text-align:center;font-size:17px;font-weight:800;color:#765744}.error,.closed{padding:34px 18px;text-align:center;line-height:1.8;font-weight:800}.error{color:#8a3e09}.closed{color:#6b4b36}.closed strong{display:block;font-size:24px;color:#d95a08;margin-bottom:8px}.closed .sub{font-size:15px;font-weight:700;color:#6f6259}.actions{display:grid;gap:10px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:14px;text-decoration:none;font-size:18px;font-weight:900}.line{background:#06c755;color:#fff}.phone{background:#fff;color:#b84f00;border:2px solid #f36c0a}.web{background:#f36c0a;color:#fff}.note{text-align:center;font-size:13px;line-height:1.65;color:#66594f;margin:13px 8px 0}.accident{display:block;margin-top:18px;padding:16px;border-radius:14px;background:#fff4e8;border:1px solid #f3c69e;color:#8a3e09;text-align:center;text-decoration:none;font-size:16px;font-weight:900}.info{text-align:center;font-size:13px;line-height:1.8;color:#76685f;margin-top:19px}@media(max-width:430px){.title{font-size:25px}.wrap{padding-top:13px}}</style><style id="kj-notice-css">

</head><body><main class="wrap"><div class="brand">倉治整骨院</div><h1 class="title" id="title">本日の予約空き状況</h1><div class="updated" id="updated">最新情報を確認しています…</div><div id="kj-notice-root" aria-live="polite"></div><section class="status" id="status"><div class="loading">予約空き状況を確認中です…</div></section><div class="actions"><a class="btn line" data-ga="line_status" href="https://lin.ee/R9YWaJx">LINEで予約・相談</a><a class="btn phone" data-ga="phone_status" href="tel:0728923223">☎ 072-892-3223 に電話する</a><a class="btn web" data-ga="web_booking_status" href="https://kurazi0510-creator.github.io/kuraji/book.html">WEB予約</a></div><p class="note">空き状況は変動します。表示中の時間でも、ご連絡のタイミングにより埋まっている場合があります。</p><a class="accident" data-ga="traffic_accident_status" href="https://kurazi0510-creator.github.io/kuraji/traffic_accident.html">🚗 交通事故・むちうちの無料相談</a><div class="info">倉治整骨院<br>大阪府交野市倉治1丁目22-15<br>8:30〜12:30／15:00〜20:00<br>木曜・土曜は午前のみ／日曜・祝日休診</div></main><script>
document.querySelectorAll('[data-ga]').forEach(function(a){
  a.addEventListener('click',function(){
    if(typeof gtag==='function')gtag('event',this.dataset.ga,{page_location:location.href});
  });
});
(function(){
  const GAS='https://script.google.com/macros/s/AKfycbyRO5WSOy-nZw4eMwFaTS-9wYXwNgoQoMZbre3hRf2C9McEfnyrDUNTWm7YvmOL4J5w/exec';
  const status=document.getElementById('status'),updated=document.getElementById('updated'),title=document.getElementById('title');
  const MAX_ATTEMPTS=5;
  let attempts=0,complete=false,requestActive=false;
  function jpParts(v){
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(v||new Date()),out={};
    parts.forEach(function(part){out[part.type]=part.value});return out;
  }
  function closeMinute(p){if(p.weekday==='Sun')return 0;if(p.weekday==='Thu'||p.weekday==='Sat')return 750;return 1200}
  function isClosedNow(){const p=jpParts();return p.weekday==='Sun'||(+p.hour*60 + +p.minute)>=closeMinute(p)}
  function dateKey(v){const p=jpParts(new Date(v));return p.year+'-'+p.month+'-'+p.day}
  function todayKey(){return dateKey(new Date())}
  function yesterdayKey(){return dateKey(new Date(Date.now()-86400000))}
  function publishedAfterClose(v){
    if(!v||dateKey(v)!==todayKey())return false;
    const p=jpParts(new Date(v));return p.weekday==='Sun'||(+p.hour*60 + +p.minute)>=closeMinute(p);
  }
  function isPreviousEveningUpdate(v){
    if(!v||dateKey(v)!==yesterdayKey())return false;
    const p=jpParts(new Date(v));return p.weekday==='Sun'||(+p.hour*60 + +p.minute)>=closeMinute(p);
  }
  function showClosed(){
    title.textContent='本日の予約空き状況';
    status.innerHTML='<div class="closed"><strong>本日の受付は終了しました</strong><div class="sub">次回の空き状況が公開されましたら、こちらに表示します。<br>明日以降のご予約はWEB予約もご利用いただけます。</div></div>';
    updated.textContent='本日の受付は終了しました';
  }
  function usable(data){return !!(data&&data.ok&&typeof data.image==='string'&&data.image.length>100&&data.updatedAt)}
  function showImage(data,label){
    const img=document.createElement('img');
    img.alt='倉治整骨院 '+label;
    img.onerror=function(){
      status.innerHTML='<div class="error">画像を表示できませんでした。<br>LINEまたはお電話でお問い合わせください。</div>';
      updated.textContent='';
    };
    img.src=data.image;
    status.innerHTML='';
    status.appendChild(img);
  }
  function render(data){
    if(isClosedNow()){
      if(publishedAfterClose(data.updatedAt)){
        title.textContent='次回診療日の予約空き状況';
        showImage(data,'次回診療日の予約空き状況');
        updated.textContent='本日の受付終了後に更新された最新情報です';
      }else showClosed();
      return;
    }
    if(dateKey(data.updatedAt)!==todayKey()&&!isPreviousEveningUpdate(data.updatedAt)){
      status.innerHTML='<div class="closed"><strong>本日の空き状況は未更新です</strong><div class="sub">別日の予約画像は表示していません。<br>LINEまたはお電話でお問い合わせください。</div></div>';
      updated.textContent='本日分の最新情報をご確認ください';return;
    }
    title.textContent='本日の予約空き状況';
    showImage(data,'本日の予約空き状況');
    updated.textContent=isPreviousEveningUpdate(data.updatedAt)?'前日の受付終了後に更新済み':'本日更新済み';
  }
  function accept(){
    const data=window.KURAJI_LATEST_STATUS;
    if(!usable(data))return false;
    complete=true;
    render(data);return true;
  }
  function unavailable(){
    if(complete||accept())return;
    if(isClosedNow()){showClosed();return}
    status.innerHTML='<div class="error">本日の空き状況を取得できませんでした。<br>LINEまたはお電話でお問い合わせください。</div>';
    updated.textContent='';
  }
  function retry(){
    if(complete||requestActive||accept())return;
    if(attempts>=MAX_ATTEMPTS){unavailable();return}
    attempts++;requestActive=true;
    if(attempts>1)updated.textContent='最新情報を再確認しています…';
    const s=document.createElement('script');
    s.src=GAS+'?action=js&t='+Date.now()+'&try='+attempts;
    let settled=false;
    const watchdog=setTimeout(fail,12000);
    function fail(){
      if(settled)return;
      settled=true;requestActive=false;
      if(!accept())setTimeout(retry,attempts===MAX_ATTEMPTS?0:500);
    }
    s.onerror=fail;
    s.onload=function(){
      if(settled){accept();return}
      clearTimeout(watchdog);
      fail();
    };
    document.body.appendChild(s);
  }
  // タイムアウトや途中の失敗では画像を消さず、遅れて届いた応答も受け取る。
  window.addEventListener('kuraji-status-loaded',function(){
    if(!accept()&&!requestActive)setTimeout(retry,0);
  });
  retry();
})();
</script><script id="kj-notice-js">
/* お知らせカード（新規・独立）。既存の status 表示とは別の処理で、失敗しても何もしない。
   使う名前：window.KURAJI_NOTICE_STATUS / KURAJI_NOTICE_IMAGE、イベント kuraji-notice-loaded / kuraji-notice-image-loaded、kj-notice-* */
(function(){
  try{
    var KJ_NOTICE_GAS='__NOTICE_GAS_URL__';
    if(!KJ_NOTICE_GAS||KJ_NOTICE_GAS.indexOf('__NOTICE')===0)return;      // 未設定のときは何もしない
    var root=document.getElementById('kj-notice-root');if(!root)return;
    var WAIT_MS=8000,IMG_WAIT_MS=15000,RECHECK_MS=60000;
    var lastCheck=0,busy=false,hideTimer=0,current=null,offset=0;

    function loadScript(url,waitMs,cb){
      var s=document.createElement('script'),settled=false,timer;
      function fin(ok){if(settled)return;settled=true;clearTimeout(timer);try{if(s.parentNode)s.parentNode.removeChild(s)}catch(e){}cb(ok)}
      s.async=true;s.onload=function(){fin(true)};s.onerror=function(){fin(false)};
      timer=setTimeout(function(){fin(false)},waitMs);
      s.src=url;(document.head||document.documentElement).appendChild(s);
    }
    function clearCard(){clearTimeout(hideTimer);current=null;try{root.textContent=''}catch(e){}}
    function fetchStatus(){
      if(busy)return;busy=true;lastCheck=Date.now();
      try{window.KURAJI_NOTICE_STATUS=undefined}catch(e){}
      loadScript(KJ_NOTICE_GAS+'?action=notice_js&t='+Date.now(),WAIT_MS,function(ok){
        busy=false;
        var d=ok?window.KURAJI_NOTICE_STATUS:null;
        if(!d||d.ok!==true||d.active!==true||!d.thumb){clearCard();return}
        render(d);
      });
    }
    function render(d){
      var sNow=Date.parse(d.serverNow);offset=isNaN(sNow)?0:(sNow-Date.now());
      if(current&&current.id===d.id&&root.firstChild){current=d;scheduleHide(d);return}
      clearCard();current=d;
      var btn=document.createElement('button');btn.type='button';btn.className='kj-notice-card';
      btn.setAttribute('aria-label','お知らせを拡大して見る');
      var img=document.createElement('img');img.className='kj-notice-thumb';img.alt='';img.src=d.thumb;
      var body=document.createElement('span');body.className='kj-notice-body';
      var tag=document.createElement('span');tag.className='kj-notice-tag';tag.textContent='お知らせ';
      var ti=document.createElement('span');ti.className='kj-notice-title';ti.textContent=d.title||'倉治整骨院からのお知らせ';
      var sub=document.createElement('span');sub.className='kj-notice-sub';sub.textContent=d.endLabel||'';
      body.appendChild(tag);body.appendChild(ti);body.appendChild(sub);
      var more=document.createElement('span');more.className='kj-notice-more';more.textContent='拡大 ▶';
      btn.appendChild(img);btn.appendChild(body);btn.appendChild(more);
      btn.addEventListener('click',function(){openViewer(d)});
      root.appendChild(btn);scheduleHide(d);
    }
    function scheduleHide(d){
      clearTimeout(hideTimer);
      var end=Date.parse(d.endAt);if(isNaN(end))return;
      var ms=end-(Date.now()+offset);
      if(ms<=0){clearCard();return}
      hideTimer=setTimeout(function(){clearCard()},Math.min(ms,2147000000));
    }
    function openViewer(d){
      try{if(typeof gtag==='function')gtag('event','notice_open',{page_location:location.href})}catch(e){}
      var ov=document.createElement('div');ov.className='kj-notice-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
      var inn=document.createElement('div');inn.className='kj-notice-ov-in';
      var msg=document.createElement('div');msg.className='kj-notice-msg';msg.textContent='画像を読み込み中です…';
      var close=document.createElement('button');close.type='button';close.className='kj-notice-close';close.textContent='閉じる';
      inn.appendChild(msg);inn.appendChild(close);ov.appendChild(inn);document.body.appendChild(ov);
      var prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
      function shut(){document.removeEventListener('keydown',onKey);document.body.style.overflow=prevOverflow;try{ov.parentNode.removeChild(ov)}catch(e){}}
      function onKey(ev){if(ev.key==='Escape')shut()}
      document.addEventListener('keydown',onKey);
      close.addEventListener('click',shut);
      ov.addEventListener('click',function(ev){if(ev.target===ov)shut()});
      try{window.KURAJI_NOTICE_IMAGE=undefined}catch(e){}
      loadScript(KJ_NOTICE_GAS+'?action=notice_image&id='+encodeURIComponent(d.id)+'&t='+Date.now(),IMG_WAIT_MS,function(ok){
        var r=ok?window.KURAJI_NOTICE_IMAGE:null;
        if(!ov.parentNode)return;
        if(!r||r.ok!==true||!r.image){msg.textContent='画像を表示できませんでした。時間をおいてもう一度お試しください。';return}
        var im=document.createElement('img');im.alt=d.title||'お知らせ';im.src=r.image;
        inn.replaceChild(im,msg);
      });
    }
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'&&Date.now()-lastCheck>RECHECK_MS)fetchStatus();
    });
    // ページの読み込み完了後に始める（お知らせの通信が、ページの「読み込み中」表示を引き延ばさないため）。
    // 完了が遅れても、3秒後には始める。
    var started=false;function go(){if(started)return;started=true;setTimeout(fetchStatus,0)}
    if(document.readyState==='complete')go();else window.addEventListener('load',go);
    setTimeout(go,3000);
  }catch(e){}
})();
</script>
