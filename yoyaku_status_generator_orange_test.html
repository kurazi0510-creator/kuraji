<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>倉治整骨院｜予約空き状況 オレンジ版</title><style>*{box-sizing:border-box}body{margin:0;background:#16213e;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#333;padding:16px 12px 50px}.wrap{max-width:460px;margin:auto}h1{color:#fff;text-align:center;font-size:18px}.panel{background:#fff;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;align-items:center}.row input{flex:1;padding:11px;border:2px solid #ddd;border-radius:10px;font-size:16px}.auto,.gen,.save,.publish{width:100%;border:0;border-radius:13px;padding:15px;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}.auto{background:#2e7d32;color:#fff}.gen{background:linear-gradient(135deg,#ef6c00,#ffb300);color:#fff;font-size:17px}.save{background:#22c55e;color:#fff}.publish{background:#2563eb;color:#fff}.status{text-align:center;font-size:12px;color:#666;margin:8px}.groups{margin-top:12px}.label{font-weight:800;color:#e65100;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.slot{border:2px solid #eee;background:#fafafa;border-radius:9px;padding:9px 2px;text-align:center;font-size:13px;cursor:pointer}.slot.on{background:#ef6c00;border-color:#ef6c00;color:#fff;font-weight:800}.preview{display:none;margin-top:14px}.preview.on{display:block}canvas{width:100%;border-radius:14px;box-shadow:0 8px 30px #0008}.note{color:#aaa;font-size:11px;text-align:center;margin-top:8px}</style></head><body><div class="wrap"><h1>🏥 倉治整骨院｜予約空き状況</h1><div class="panel"><div class="row"><b>日付</b><input id="date" type="date"></div><button class="auto" onclick="loadSlots()">🔄 予約表と連動して自動取得</button><div id="fetchStatus" class="status"></div><div class="groups"><div class="label">🌅 午前</div><div id="am" class="grid"></div><div class="label">🌆 午後</div><div id="pm" class="grid"></div></div></div><button class="gen" onclick="generate()">🎨 予約空き状況の画像を生成</button><div id="preview" class="preview"><canvas id="cv" width="800" height="800"></canvas><button class="save" onclick="saveImage()">💾 写真を保存する</button><button id="pub" class="publish" onclick="publishImage()">📡 最新の予約状況として公開</button><div id="pubStatus" class="status"></div><div class="note">Instagramストーリーズにもそのまま使用できます</div></div></div><script>const BOOKING_GAS='https://script.google.com/macros/s/AKfycbxN8GuaDOG2WnR9OiJINtqoMOz2guWn-TrmRlkLQIs3QAvuLZxDh1obSNGDbpFto2oltg/exec';const selected=new Set();let generatedDate='';const pad=n=>String(n).padStart(2,'0');function norm(t){let s=String(t).trim();let m=s.match(/(\d{1,2})[:時](\d{1,2})?/);if(!m)return s;return Number(m[1])+':'+pad(Number(m[2]||0))}function mins(t){let m=norm(t).match(/(\d+):(\d+)/);return m?+m[1]*60 + +m[2]:9999}function render(slots){selected.clear();const am=document.getElementById('am'),pm=document.getElementById('pm');am.innerHTML='';pm.innerHTML='';slots.map(norm).sort((a,b)=>mins(a)-mins(b)).forEach(t=>{selected.add(t);const b=document.createElement('div');b.className='slot on';b.textContent=t;b.onclick=()=>{selected.has(t)?selected.delete(t):selected.add(t);b.classList.toggle('on')};(mins(t)<13*60?am:pm).appendChild(b)});if(!am.children.length)am.innerHTML='<span style="color:#aaa;font-size:12px">空きなし</span>';if(!pm.children.length)pm.innerHTML='<span style="color:#aaa;font-size:12px">空きなし</span>'}async function loadSlots(){const d=document.getElementById('date').value,s=document.getElementById('fetchStatus');if(!d){alert('日付を選んでください');return}s.textContent='取得中…';try{const r=await fetch(BOOKING_GAS+'?action=getAvailableSlots&date='+encodeURIComponent(d)+'&t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.message||'取得失敗');let a=j.available||[];if(d===new Date().toISOString().slice(0,10)){const now=new Date(),n=now.getHours()*60+now.getMinutes();a=a.filter(x=>mins(x)>n)}render(a);s.textContent=a.length+'枠を取得しました'}catch(e){s.textContent='取得できませんでした：'+e.message}}function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}function drawGroup(c,arr,label,y){if(!arr.length)return y;c.fillStyle='#fff3e0';rr(c,36,y,108,30,15);c.fill();c.fillStyle='#b94700';c.textAlign='center';c.font='700 18px sans-serif';c.fillText(label,90,y+21);y+=38;const cols=4,g=10,w=(728-g*3)/4,h=arr.length>16?45:arr.length>8?50:58,f=arr.length>16?29:arr.length>8?31:34;arr.forEach((t,i)=>{const x=36+(i%cols)*(w+g),yy=y+Math.floor(i/cols)*(h+g);c.fillStyle='#fff';rr(c,x,yy,w,h,12);c.fill();c.fillStyle='#9a3c00';c.textBaseline='middle';c.font='800 '+f+'px sans-serif';c.fillText(t,x+w/2,yy+h/2)});c.textBaseline='alphabetic';return y+Math.ceil(arr.length/cols)*(h+g)-g}function generate(){const d=document.getElementById('date').value;if(!d){alert('日付を選んでください');return}if(!selected.size){alert('空き時間を選んでください');return}const cv=document.getElementById('cv'),c=cv.getContext('2d'),dt=new Date(d+'T00:00:00'),m=dt.getMonth()+1,day=dt.getDate(),dow='日月火水木金土'[dt.getDay()],all=[...selected].sort((a,b)=>mins(a)-mins(b)),am=all.filter(x=>mins(x)<780),pm=all.filter(x=>mins(x)>=780);const gr=c.createLinearGradient(0,0,800,800);gr.addColorStop(0,'#ffb347');gr.addColorStop(.55,'#f57c00');gr.addColorStop(1,'#e65100');c.fillStyle=gr;c.fillRect(0,0,800,800);c.fillStyle='rgba(255,255,255,.13)';for(let i=-800;i<1000;i+=80){c.save();c.translate(i,0);c.rotate(-.35);c.fillRect(0,0,24,1100);c.restore()}c.fillStyle='rgba(120,45,0,.35)';c.fillRect(0,0,800,105);c.fillStyle='#fff';c.textAlign='center';c.font='800 45px sans-serif';c.fillText('本日の予約空き状況',400,66);c.textAlign='left';c.font='800 37px sans-serif';c.fillText(m+'/'+day+'（'+dow+'）',38,151);let y=171;y=drawGroup(c,am,'午前',y);if(am.length&&pm.length)y+=7;y=drawGroup(c,pm,'午後',y);let by=y+10;c.fillStyle='#fff3e0';rr(c,36,by,260,48,24);c.fill();c.fillStyle='#a64200';c.textAlign='center';c.font='800 24px sans-serif';c.fillText('✓ 空いています',166,by+32);c.fillStyle='#fff';c.textAlign='left';c.font='800 23px sans-serif';c.fillText('当日予約もOKです',320,by+31);c.fillStyle='rgba(255,255,255,.95)';rr(c,50,744,700,40,20);c.fill();c.fillStyle='#9a3c00';c.textAlign='center';c.font='800 20px sans-serif';c.fillText('倉治整骨院｜ご予約・お問い合わせ受付中',400,771);generatedDate=d;document.getElementById('preview').classList.add('on');document.getElementById('preview').scrollIntoView({behavior:'smooth'})}function saveImage(){const a=document.createElement('a');a.href=document.getElementById('cv').toDataURL('image/jpeg',.94);a.download='倉治整骨院_予約空き状況_'+generatedDate+'.jpg';a.click()}function creds(){let u=localStorage.getItem('kuraji_publish_gas_url_v1'),t=localStorage.getItem('kuraji_publish_token_v1');if(!u){u=prompt('公開用GAS URLを入力してください');if(u)localStorage.setItem('kuraji_publish_gas_url_v1',u.trim())}if(!t){t=prompt('公開用トークンを入力してください');if(t)localStorage.setItem('kuraji_publish_token_v1',t.trim())}return[u,t]}async function publishImage(){const [u,t]=creds();if(!u||!t)return;const s=document.getElementById('pubStatus'),b=document.getElementById('pub');b.disabled=true;s.textContent='公開中…';try{const image=document.getElementById('cv').toDataURL('image/jpeg',.9);const r=await fetch(u,{method:'POST',body:JSON.stringify({token:t,image})});const j=await r.json();if(!j.ok)throw new Error(j.error||'公開失敗');s.textContent='✅ 公開しました（'+new Date(j.updatedAt||Date.now()).toLocaleString('ja-JP')+'）'}catch(e){s.textContent='❌ '+e.message}finally{b.disabled=false}}(()=>{const n=new Date(Date.now()+86400000);document.getElementById('date').value=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())})();</script></body></html>
